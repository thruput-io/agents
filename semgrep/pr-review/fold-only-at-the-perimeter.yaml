rules:
  - id: fold-only-at-the-perimeter
    languages: [typescript]
    severity: ERROR
    message: "Only the perimeter folds a domain object into a foreign shape. Call a method of the object instead."
    paths:
      include:
        - "**/src/domain/**"
        - "**/src/controller/**"
        - "**/src/client/**"
        - "**/src/adapters/**"
      exclude:
        - "**/*.test.ts"
        - "**/*.test-support.ts"
        - "**/*.narrow-test.ts"
        - "**/src/generated/**"
    pattern: "$X.foldedBy(...)"
