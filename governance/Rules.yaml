rules:
- id: Stated purpose
  marker: MUST
  group: Purpose & Accuracy
  parent: Code Only for User Value
  body: |
    State the [[Purpose]] of every change.
- id: No code without purpose
  marker: MUST NOT
  group: Purpose & Accuracy
  parent: Code Only for User Value
  body: |
    Write or merge code whose [[Purpose]] is not stated.
- id: Every part solves the Purpose
  marker: MUST
  group: Purpose & Accuracy
  parent: Code as a Subset of the Purpose
  body: |
    Trace every part of the change to the part of the stated [[Purpose]] it solves.
- id: Nothing beyond the Purpose
  marker: MUST NOT
  group: Purpose & Accuracy
  parent: Code as a Subset of the Purpose
  body: |
    Solve more than the stated [[Purpose]].
- id: No speculative portability
  marker: MUST NOT
  group: Purpose & Accuracy
  parent: Loud Failures Over Silent Defaults
  body: |
    Add platform, shell, or environment compatibility branches for environments the task does not run in.
- id: Earlier rung that serves
  marker: MUST NOT
  group: Simplicity & Code Reuse
  parent: The Simplicity Ladder
  body: |
    Meet a need on a rung of the [[Simplicity ladder]] when an earlier rung serves it. [[New code]], or a new dependency, where an earlier rung serves is the smell.
- id: Available
  marker: MUST NOT
  group: Simplicity & Code Reuse
  parent: The Simplicity Ladder
  body: |
    Adopt existing code that requires payments or license models, or an extra [[Platform or framework]], that would increase the maintenance burden.
- id: Maintained
  marker: MUST
  group: Simplicity & Code Reuse
  parent: The Simplicity Ladder
  body: |
    Adopt existing code only where it is stable, documented, and maintained by several active contributors.
- id: Consistent with the codebase
  marker: MUST
  group: Maintainability & Standards
  parent: Convention Over Novelty
  body: |
    Follow the surrounding code where no [[Demonstrable standard]] decides the question; a second way of doing the same thing is the smell.
- id: Demonstrable, not recalled
  marker: MUST
  group: Maintainability & Standards
  parent: Convention Over Novelty
  body: |
    Point at a [[Demonstrable standard]] whenever you invoke a standard as justification. Novel work is not required to cite a standard it does not have.
- id: Validating factory
  marker: MUST
  group: At Creation
  parent: Parse, don't validate
  body: |
    Provide instances only through a named factory that establishes every invariant before returning.
- id: Private constructor
  marker: MUST
  group: At Creation
  parent: Parse, don't validate
  body: |
    Keep the constructor private, or unexported from its module.
- id: Creation failure in the signature
  marker: MUST
  group: At Creation
  parent: Parse, don't validate
  body: |
    Return the invalid-input case from a factory in its type signature rather than throw.
- id: Sum types
  marker: MUST
  group: In Representation
  parent: Make illegal states unrepresentable
  body: |
    Enumerate the legal alternatives as a closed sum type rather than a product of optional fields.
- id: Enums for domain states
  marker: MUST
  group: In Representation
  parent: Make illegal states unrepresentable
  body: |
    Name every legal state with a closed enum; a boolean or free-form string for a state is the smell.
- id: Compile-time optionality
  marker: MUST
  group: In Representation
  parent: Make illegal states unrepresentable
  body: |
    Make absence an explicit case the compiler forces every caller to handle; a runtime check for absence is the smell.
- id: Wrap primitives
  marker: MUST
  group: In Representation
  parent: Primitives only at the perimeter
  body: |
    Wrap a raw value in its [[Domain primitive]] before it crosses any interface of ours; a raw primitive in a domain signature is the smell.
- id: Exhaustive matching
  marker: MUST
  group: Across State Changes
  parent: Make illegal states unrepresentable
  body: |
    Match over the closed set of cases with no wildcard.
- id: Self-guarding aggregates
  marker: MUST
  group: Across State Changes
  parent: Make illegal states unrepresentable
  body: |
    Route every state change through a domain method that re-establishes invariants; an exposed [[Setter]] or raw collection is the smell.
- id: No mutators
  marker: MUST NOT
  group: Across State Changes
  parent: Immutable by default
  body: |
    Expose a [[Setter]] or any operation that changes a [[Domain object]] in place. A change returns a new instance that passes the [[Validating path of creation]] again.
- id: No unwrapping
  marker: MUST NOT
  group: Domain Operations & Interfaces
  parent: Make illegal states unrepresentable
  body: |
    Unwrap [[Domain objects]] into primitives for comparison.
- id: Strong typing
  marker: MUST NOT
  group: Domain Operations & Interfaces
  parent: Make illegal states unrepresentable
  body: |
    Represent a domain concept, identifier, state, or measurement with a dynamic, untyped, or unstructured type.
- id: Domain-only interfaces
  marker: MUST
  group: Domain Operations & Interfaces
  parent: Make illegal states unrepresentable
  body: |
    Access a [[Domain object]] only through methods that accept and return [[Domain object]]s, the [[Validating factory]] at the [[Perimeter]] excepted.
- id: Domain operations
  marker: MUST
  group: Domain Operations & Interfaces
  parent: Make illegal states unrepresentable
  body: |
    Perform comparison, addition, subtraction, or any other domain operation via domain methods.
- id: Respect layering
  marker: MUST
  group: Architecture & Layering
  parent: Separation of Concerns
  body: |
    Import or call against the dependency direction the architecture declares: from a layer into the layer above it, or skipping a layer.
- id: No primitive leakage
  marker: MUST
  group: Architecture & Layering
  parent: Primitives only at the perimeter
  body: |
    Keep raw primitives from crossing a layer boundary.
- id: Delete unused
  marker: MUST
  group: Dead Code & Comments
  parent: The Simplicity Ladder
  body: |
    Delete tests, production code, and helper code that are no longer relevant or used.
- id: No comments in code
  marker: MUST NOT
  group: Dead Code & Comments
  parent: Durable Intent Over Comments
  body: |
    Comment any version-controlled artifact. Only a [[Machine-read comment]] is exempt.
- id: No silent catch
  marker: MUST NOT
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Use try/catch blocks that do not rethrow (silencing failures).
- id: No default on failure
  marker: MUST NOT
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Return or use a default value when failing.
- id: No strategy fallback
  marker: MUST NOT
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Make code 'hardened' by trying another strategy when the first one fails.
- id: No suppressed exit status
  marker: MUST NOT
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Discard a command's non-zero exit status so that a failure passes as success.
- id: No discarded diagnostics
  marker: MUST NOT
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Send a command's error output nowhere, or use another tool to detect state instead of letting the failing tool report its error.
- id: Scripts abort on error
  marker: MUST
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Let a script continue past a failing step. Every script runs in the language's abort-on-error mode, and a failing step ends it at once.
- id: No degraded continuation
  marker: MUST NOT
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Proceed with stale, partial, or assumed input after the step that produces it failed; report and stop.
- id: No muted tests
  marker: MUST NOT
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Mute or skip tests.
- id: Linear deterministic code
  marker: MUST NOT
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Write tests that contain branching logic, such as, but not limited to, `if` statements, default fallbacks, or `switch` expressions.
- id: No coverage-only tests
  marker: MUST NOT
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Write tests that discard return values just to increase coverage.
- id: Assert values
  marker: MUST
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Assert the actual returned values — not merely that no error occurred.
- id: Add tests for new code
  marker: MUST
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Add tests for [[New code]].
- id: Add tests for updated code
  marker: MUST
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Add tests for updated code.
- id: Troubleshooting unit test
  marker: MUST
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Add a [[Unit test]] for any exploratory troubleshooting, even when a natural home for it does not exist.
- id: No retry on failure
  marker: MUST NOT
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Configure a test to run again until it passes, by a retry count, a retry annotation, or a flaky marker.
- id: One subject under test
  marker: MUST NOT
  group: Unit Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Include more than one subject under test or test the composition of objects within a [[Unit test]].
- id: No test case coupling
  marker: MUST NOT
  group: Unit Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Allow one test case to depend on another; every test case is executable on its own, in any order.
- id: Integration Tests Are Black-Box
  marker: MUST
  group: Integration Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Test the runtime artifact being shipped via its public APIs, black box.
- id: Production Parity
  marker: MUST
  group: Integration Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Simulate production instead of altering the behavior of the runtime artifact.
- id: No global lint changes
  marker: MUST NOT
  group: Quality Tooling & Shift Left
  parent: The Toolchain Is the Guardrail
  body: |
    Change global or project-wide linting rules.
- id: No global quality changes
  marker: MUST NOT
  group: Quality Tooling & Shift Left
  parent: The Toolchain Is the Guardrail
  body: |
    Change global or project-wide [[Quality]] standards.
- id: No disabling via pragma
  marker: MUST NOT
  group: Quality Tooling & Shift Left
  parent: Shift Test Left
  body: |
    Disable linting rules via comments or pragmas.
- id: Earlier rung that can
  marker: MUST NOT
  group: Quality Tooling & Shift Left
  parent: Shift Test Left
  body: |
    Catch a defect on a rung of the [[Shift Left ladder]] when an earlier rung can catch it. A runtime check, or a test, for what a type or a linter would reject is the smell.
- id: No committing generated code
  marker: MUST NOT
  group: Quality Tooling & Shift Left
  parent: The Toolchain Is the Guardrail
  body: |
    Commit generated code.
- id: Strict presets
  marker: MUST
  group: Quality Tooling & Shift Left
  parent: Shift Test Left
  body: |
    Use the strictest possible presets on linting and style.
- id: No optionality
  marker: MUST NOT
  group: Optionality
  parent: Optionality Drives Complexity
  body: |
    Use optional variables or parameters unless a [[Framework]] or third-party [[Library]] forces them.
- id: Prefer APIs without optionality
  marker: MUST
  group: Optionality
  parent: Fold at Perimeter
  body: |
    Choose, among [[Code We Cannot Control]] that meets the need, an API without optional parameters over one with them.
- id: Overload per option combination
  marker: MUST
  group: Optionality
  parent: Optionality Drives Complexity
  body: |
    Provide an overload or an [[Explicitly named method]] for each allowed combination of options instead of optional parameters.
- id: Forced optionality at perimeter
  marker: MUST
  group: Optionality
  parent: Fold at Perimeter
  body: |
    Handle [[Optionality]] forced by [[Code We Cannot Control]] in the statement that invokes it or receives its return.
- id: Accept unknown properties
  marker: MUST
  group: Robustness
  parent: Producer moves first
  body: |
    Accept input that carries properties you do not know, and ignore them.
- id: Generic parameters, specific returns
  marker: MUST
  group: Robustness
  parent: Producer moves first
  body: |
    Declare the most generic parameter types and the most specific return type a method can honour.
- id: No unstated standard
  marker: MUST NOT
  group: Agents
  parent: Adoption is articulation
  body: |
    Instruct an [[AI agent]] to follow a coding standard that has no entry in these documents; add the entry and cite it.
- id: One-command setup
  marker: MUST
  group: Reproducibility
  parent: The environment is code
  body: |
    Keep clone, build, and test of the entire stack to one documented command; a new manual setup step is the smell.
- id: Twice is automated
  marker: MUST
  group: Reproducibility
  parent: The environment is code
  body: |
    Script a procedure the second time it is performed; a manual procedure written down to be repeated is the smell.
- id: Ship with telemetry
  marker: MUST
  group: Runtime
  parent: Own the Runtime
  body: |
    Add the [[Signal]] in the change that adds the behaviour it shows.
