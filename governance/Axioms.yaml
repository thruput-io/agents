axioms:
- id: Single Source of Truth
  parent: Speed Through Discipline
  body: |
    Every piece of information is defined exactly once. Competing definitions is a source of confusion.
- id: Shift Left
  parent: Speed Through Discipline
  body: |
    Do every activity at the earliest point where it can be done. The earlier a question is answered, a decision is made, or a defect is found, the cheaper and more certain the outcome.
- id: Simplicity
  parent: Outcome Over Output
  body: |
    Simple solutions are better than complex. Simplicity is the fit between a job and the tools and strategies chosen to do it: a solution is simple when it carries nothing the job does not call for, and complex in proportion to what it carries beyond that.
- id: Great software is easy to maintain and extend
  parent: Joy Through Craft
  body: |
    Great software is easy to maintain and extend.
- id: Users Prove Correctness
  parent: Outcome Over Output
  body: |
    Code proves execution; [[Users]] prove [[Correctness]]. Clean, well-architected code that fails to solve a real-world problem is not almost good. It is noise, and noise is bad. Truth is measured by [[User]] outcome and real-world utility, not by internal assumptions.
- id: Leverage
  parent: Excellence Through Transparency
  body: |
    A tool multiplies the competence applied to it and supplies none of its own. What it produces is what its [[Practitioner]] already knew, arriving faster and in greater quantity; the tool decides how fast the outcome arrives, never what it is.
- id: Quality Uncompromised
  parent: Speed Through Discipline
  body: |
    Quality is always the highest priority. Every other objective becomes harder to reach once quality drops, so nothing offered in exchange for it, faster delivery, higher performance, or more features, is worth what it costs.
