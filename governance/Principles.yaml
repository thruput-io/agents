principles:
- id: Code Only for User Value
  parent: Every line serves the users' WHY
  body: |
    Without a clear notion of **WHY** a piece of code is written, it should not be written at all. We never write code without a [[Purpose]], and that [[Purpose]] is measured exclusively in the good it delivers to the [[Users]] of the code.
- id: Code as a Subset of the WHY
  parent: Every line serves the users' WHY
  body: |
    The code is a subset of the stated [[WHY]]: every part of it solves some part of the WHY, and no part reaches outside it. A change need not cover the whole WHY, but what it solves it solves accurately and without harm the [[Users]] would not accept.
- id: The Simplicity Ladder
  parent: Descend only when the rung above cannot serve
  body: |
    The simplest code of all is [[No code]]. Next in [[Simplicity]] is code we do not write ourselves.

    When solving a problem, climb the [[Simplicity ladder]].
- id: Convention Over Novelty
  parent: Convention over invention
  body: |
    Code is maintained by people who did not write it, so its structure follows the conventions of the ecosystem and of the surrounding code; novelty belongs in the domain solution, assembled from parts a maintainer already recognises. Only a [[Demonstrable standard]] counts as a convention.
- id: Shift Test Left
  parent: Descend only when the rung above cannot serve
  body: |
    A defect is caught earliest, cheapest, and with the greatest certainty on the leftmost [[Shift Left rung]] able to catch it: choosing that rung is [[Simplicity]] applied to verification, and catching it there is [[Shift Left]]. Descend past [[Illegal states unrepresentable]] and [[Static code analysis]] only when neither can prevent the defect.
- id: Durable Intent Over Comments
  parent: Intent lives where it is checked
  body: |
    What a comment would say belongs where it is checked: a name, a [[Failing test]], an [[Architectural decision]] record, or [[Usage guidance]]. Every [[Comment intent]] has such a home, and only a [[Machine-read comment]] stays in the code.
- id: Loud Failures Over Silent Defaults
  parent: Crash, don't guess
  body: |
    A system fails loudly and at once on an unexpected state; it never continues on a guess. A safeguard that swallows a failure turns a diagnosable error into a silent wrong answer, and is added only where concrete [[Evidence]] shows the need.
- id: Fold at Perimeter
  parent: Translate at the door
  body: |
    Whatever shape [[Code We Cannot Control]] hands us is folded into ours at the [[Perimeter]], and ours is folded back into theirs only there. Inward of that point nothing sees the foreign shape.
- id: Make illegal states unrepresentable
  parent: Encapsulation
  body: |
    Choose a type in which the [[Illegal state]] cannot be constructed rather than a check that rejects it at runtime, and model every business rule, lifecycle transition, and domain entity as a dedicated type rather than a generic data bag. A state that cannot be held needs no validator, no test, and no bug report.
- id: Parse, don't validate
  parent: Translate at the door
  body: |
    Parse raw input once, at the [[Perimeter]], into the constrained domain type and pass the type on; never check a primitive and pass the primitive on. Holding a value of the type is proof it was checked.
- id: Immutable by default
  parent: Encapsulation
  body: |
    A [[Domain object]] does not change after creation; a change is a new instance that passes the same [[Validating path of creation]]. A validly constructed object that cannot change cannot become invalid.
- id: Primitives only at the perimeter
  parent: Encapsulation
  body: |
    Every raw value is wrapped in a [[Domain primitive]] the moment we hold it, and unwrapped only at the [[Perimeter]] that hands it out. Inside our code a primitive has no meaning of its own.
- id: Optionality Drives Complexity
  parent: Name the case, not the knob
  body: |
    An optional parameter doubles the paths through a function and burdens every reader with whether it is present. Each allowed combination of options is its own operation with its own name.
- id: Nothing Is Complete Without Verification
  parent: Tests prove behaviour, not execution
  body: |
    A change is finished when a test shows the behaviour and fails when it breaks, not when the code is written. The tests are the documentation of what the code does.
- id: Separation of Concerns
  parent: One concern, one owner
  body: |
    Each concern is owned by one component in one layer, so changing a behaviour touches only its owner. Layers exist so that a concern is defined once and nothing else knows how it is done.
- id: The Toolchain Is the Guardrail
  parent: Make the wrong thing fail
  body: |
    The quality bar is defined once, in the build, and the build makes the wrong thing fail. The toolchain is never weakened to let a change through, and a toolchain that stops measuring stops the line.
- id: Producer moves first
  parent: Robustness Principle
  body: |
    The producer moves first; consumers accept what they do not know.
- id: Adoption is articulation
  parent: The practitioner decides the outcome
  body: |
    Adopting a tool that applies our standard begins by writing the standard down: the rule an [[AI agent]] needs is the rule a new colleague needs, and the reason it was never written is that it lived as habit. An adoption that leaves our craft no more clearly stated than before has adopted nothing.
- id: The environment is code
  parent: Environment parity
  body: |
    Every environment, the local one included, is provisioned from one definition kept in version control, and no environment is assembled by hand. A newcomer clones, builds, and tests the entire stack with a single command.
- id: Own the Runtime
  parent: Telemetry over guesswork
  body: |
    We do not hope a feature works. The telemetry, logs, and alerts that show a behaviour working ship in the same change as the behaviour; if we cannot see it, it is not shipped.
