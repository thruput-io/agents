rules:
- id: No learnt-pattern retreat
  marker: MUST NOT
  group: If in doubt
  parent: Convention Over Novelty
  body: |
    Retreat to learnt patterns or practices. A standard you can point at is not a learnt pattern — see [[Demonstrable, not recalled]].
- id: Stated purpose
  marker: MUST
  group: Purpose & Accuracy
  parent: Code Only for User Value
  body: |
    State the **WHY** of a change as what good it does for the **USERS** of the code.
- id: No code without purpose
  marker: MUST NOT
  group: Purpose & Accuracy
  parent: Code Only for User Value
  body: |
    Write or merge code whose **WHY** is not clear.
- id: Every part solves the WHY
  marker: MUST
  group: Purpose & Accuracy
  parent: Code as a Subset of the WHY
  body: |
    Trace every part of the code to the part of the stated **WHY** that it accurately solves.
- id: Nothing beyond the WHY
  marker: MUST NOT
  group: Purpose & Accuracy
  parent: Code as a Subset of the WHY
  body: |
    Solve more than the stated **WHY**.
- id: No collateral harm
  marker: MUST NOT
  group: Purpose & Accuracy
  parent: Code as a Subset of the WHY
  body: |
    Solve the **WHY** with collateral effects that users would not find acceptable.
- id: No speculative portability
  marker: MUST NOT
  group: Purpose & Accuracy
  parent: Loud Failures Over Silent Defaults
  body: |
    Add platform, shell, or environment compatibility branches for environments the task does not run in.
- id: Reuse code in this codebase
  marker: MUST
  group: Simplicity & Code Reuse
  parent: The Simplicity Ladder
  body: |
    Use an existing reusable component in this codebase rather than write an equivalent, and where the code exists but is not yet reusable, refactor it into a reusable component.
- id: Use the platform or framework
  marker: MUST
  group: Simplicity & Code Reuse
  parent: The Simplicity Ladder
  body: |
    Use a component the current platform or framework already provides rather than write an equivalent.
- id: Use an external component
  marker: MUST
  group: Simplicity & Code Reuse
  parent: The Simplicity Ladder
  body: |
    Add an existing external component as a dependency rather than write an equivalent.
- id: Use an external tool or service
  marker: MUST
  group: Simplicity & Code Reuse
  parent: The Simplicity Ladder
  body: |
    Integrate an existing external tool, or call an existing service, rather than build an equivalent.
- id: Available
  marker: MUST NOT
  group: Simplicity & Code Reuse
  parent: The Simplicity Ladder
  body: |
    Adopt existing code that requires payments or license models, or an extra platform or framework, that would increase the maintenance burden.
- id: Maintained
  marker: MUST
  group: Simplicity & Code Reuse
  parent: The Simplicity Ladder
  body: |
    Adopt existing code only where it is stable (avoiding newly introduced bugs), well-documented (backed by comprehensive documentation or verified open-source references), and actively maintained by multiple contributors with an active community.
- id: No code over maybe-necessary
  marker: PREFER
  group: Simplicity & Code Reuse
  parent: The Simplicity Ladder
  body: |
    No code over maybe-necessary code.
- id: Industry standards
  marker: MUST
  group: Maintainability & Standards
  parent: Convention Over Novelty
  body: |
    Follow the established conventions, design patterns, and idioms of the language, framework, and ecosystem in use, so that any developer who knows them can maintain our code.
- id: Consistent with the codebase
  marker: MUST
  group: Maintainability & Standards
  parent: Convention Over Novelty
  body: |
    Follow the conventions of the surrounding code where no industry standard decides the question, rather than introduce a second way of doing the same thing.
- id: Demonstrable, not recalled
  marker: MUST
  group: Maintainability & Standards
  parent: Convention Over Novelty
  body: |
    Point at a standard whenever you invoke one as justification: a maintained library or framework, a pattern in current use by a large active community, or a published convention. Novel work is not required to cite a standard it does not have. See [[No learnt-pattern retreat]].
- id: Illegal states are unrepresentable
  marker: MUST
  group: At Creation
  parent: Shift Test Left
  body: |
    Make illegal states unrepresentable in the domain layer. Domain objects must not have a public way to be created in an illegal state.
- id: Validating factory
  marker: MUST
  group: At Creation
  parent: Shift Test Left
  body: |
    Provide instances only through a named factory (smart constructor) that establishes every invariant before returning, so holding a value of the type is proof it was checked.
- id: Single creation path
  marker: MUST
  group: At Creation
  parent: Shift Test Left
  body: |
    Keep the constructor private, or unexported from its module, so the factory cannot be bypassed.
- id: Creation failure in the signature
  marker: MUST
  group: At Creation
  parent: Shift Test Left
  body: |
    Return the invalid-input case from the factory in its type signature (`Result`, `Either`, `Option`) rather than throwing, so the compiler forces every caller to handle it.
- id: Parse, don't validate
  marker: MUST
  group: At Creation
  parent: Shift Test Left
  body: |
    Parse raw input once at the perimeter into the constrained domain type instead of checking it and passing the primitive on, so downstream code can never receive unvalidated data. See [[Domain primitives]].
- id: Domain primitives
  marker: MUST
  group: In Representation
  parent: Shift Test Left
  body: |
    Wrap every primitive in its own validated immutable type (value object, tiny type), so a malformed value or a transposed argument is a compile error. Primitives appear only at perimeters.
- id: Opaque types
  marker: PREFER
  group: In Representation
  parent: Shift Test Left
  body: |
    A distinct nominal type whose representation is hidden outside its defining module (newtype, branded type) over a type alias or shared representation, so values that share a representation but not a meaning cannot be mixed.
- id: Sum types
  marker: MUST
  group: In Representation
  parent: Shift Test Left
  body: |
    Enumerate exactly the legal alternatives as a closed sum type (sealed hierarchy, discriminated union) rather than a product of optional fields, so illegal combinations have no representation.
- id: Enums for domain states
  marker: MUST
  group: In Representation
  parent: Shift Test Left
  body: |
    Name every legal state with a closed enum; a boolean or free-form string admits states the domain never defined.
- id: Compile-time optionality
  marker: MUST
  group: In Representation
  parent: Shift Test Left
  body: |
    Make absence an explicit case the compiler forces every caller to handle, so the missing case is handled exactly where it can occur. Optionality is a compile-time property (`Option`/`Maybe` or compiler-enforced nullable annotation).
- id: Constrained collections
  marker: SHOULD
  group: In Representation
  parent: Shift Test Left
  body: |
    Enforce a collection's invariants in its type: a non-empty list type makes `head` and `max` total functions, and a first-class collection hides the raw collection so uniqueness, bounds, and ordering are enforced in one place.
- id: Refinement types
  marker: SHOULD
  group: In Representation
  parent: Shift Test Left
  body: |
    Attach predicates to types and have them verified at compile time where the ecosystem provides it (refinement types, units of measure, checked type qualifiers).
- id: Immutability
  marker: MUST
  group: Across State Changes
  parent: Shift Test Left
  body: |
    Make domain objects immutable: a validly constructed object that cannot change cannot become invalid, and a change is a new instance that passes creation validation again.
- id: Typestate
  marker: PREFER
  group: Across State Changes
  parent: Shift Test Left
  body: |
    Encode the state machine in the type — each transition consumes the old state's type and returns the new one, so an operation invalid in the current state does not typecheck — over runtime state checks.
- id: Exhaustive matching
  marker: MUST
  group: Across State Changes
  parent: Shift Test Left
  body: |
    Match over the closed set of cases with no wildcard, so a new state that some transition does not handle is a compile error, not a silent fall-through.
- id: Self-guarding aggregates
  marker: MUST
  group: Across State Changes
  parent: Shift Test Left
  body: |
    Route every state change through a domain method that re-establishes invariants, and expose no setter or raw collection that could skip them.
- id: No unwrapping
  marker: MUST NOT
  group: Domain Operations & Interfaces
  parent: Shift Test Left
  body: |
    Unwrap domain objects into primitives for comparison.
- id: Strong typing
  marker: MUST NOT
  group: Domain Operations & Interfaces
  parent: Shift Test Left
  body: |
    Use dynamic, untyped, or unstructured types (`any`, `object`, raw maps/dictionaries), or raw primitives directly (`string`, `number`, `boolean`, etc.) to represent domain concepts, identifiers, states, or measurements. Domain logic MUST operate exclusively on strongly typed domain models and validated domain primitives.
- id: Strict domain modeling
  marker: MUST
  group: Domain Operations & Interfaces
  parent: Shift Test Left
  body: |
    Model all business rules, lifecycle transitions, and domain entities with dedicated, single-purpose domain types rather than generic data bags or persistence records.
- id: Domain-only interfaces
  marker: MUST
  group: Domain Operations & Interfaces
  parent: Shift Test Left
  body: |
    Access domain objects only via public methods that accept and return strictly other domain objects, with the sole exception of perimeter validating factories ([[Validating factory]]) that parse raw input into domain types.
- id: Domain operations
  marker: MUST
  group: Domain Operations & Interfaces
  parent: Shift Test Left
  body: |
    Perform comparison, addition, subtraction, or any other domain operation via domain methods.
- id: Implement Comparable
  marker: PREFER
  group: Domain Operations & Interfaces
  parent: Shift Test Left
  body: |
    Implement `Comparable` or similar domain interfaces over operating on primitives directly.
- id: No collapsed layers
  marker: MUST NOT
  group: Architecture & Layering
  parent: Separation of Concerns
  body: |
    Collapse layers for simplicity.
- id: Respect layering
  marker: MUST
  group: Architecture & Layering
  parent: Separation of Concerns
  body: |
    Respect architectural layering.
- id: No primitive leakage
  marker: MUST
  group: Architecture & Layering
  parent: Separation of Concerns
  body: |
    Prevent primitive leakage across layers.
- id: Separation over brevity
  marker: PREFER
  group: Architecture & Layering
  parent: Separation of Concerns
  body: |
    Separate concerns over saving lines of code.
- id: Delete unused
  marker: MUST
  group: Dead Code & Comments
  parent: The Simplicity Ladder
  body: |
    Delete tests, production code, and helper code that are no longer relevant or used.
- id: No comments in code
  marker: MUST NOT
  group: Dead Code & Comments
  parent: Durable Intent Over Comments
  body: |
    Comment code, configuration, or any other version-controlled artifact. A comment is exempt only where something other than a human reader requires it: a shebang; a machine-read directive that is syntactically a comment (an SPDX identifier, file encoding declaration); API documentation extracted to a published doc site (Javadoc, KDoc, docstrings); a mandated license header; a generated-file banner. See [[Durable Intent Over Comments]].
- id: No silent catch
  marker: MUST NOT
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Use try/catch blocks that do not rethrow (silencing failures).
- id: No default on failure
  marker: MUST NOT
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Return or use a default value when failing.
- id: No strategy fallback
  marker: MUST NOT
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Make code 'hardened' by trying another strategy when the first one fails.
- id: Fail fast
  marker: MUST
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Fail fast on unexpected state.
- id: No suppressed exit status
  marker: MUST NOT
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Discard a command's non-zero exit status with `|| true`, `|| :`, or an equivalent.
- id: No discarded diagnostics
  marker: MUST NOT
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Send a command's stderr to `/dev/null`, or use another tool to detect state instead of letting the failing tool report its error.
- id: Scripts abort on error
  marker: MUST
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Enable 'set -euo pipefail' (or the language's equivalent error-abort configuration) in every script, and let a failing step abort execution immediately.
- id: No degraded continuation
  marker: MUST NOT
  group: Behavior & Failure Handling
  parent: Loud Failures Over Silent Defaults
  body: |
    Proceed with stale, partial, or assumed input after the step that produces it failed; report and stop.
- id: No muted tests
  marker: MUST NOT
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Mute or skip tests.
- id: Linear deterministic code
  marker: MUST NOT
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Write tests that contain branching logic, such as, but not limited to, `if` statements, default fallbacks, or `switch` expressions.
- id: No coverage-only tests
  marker: MUST NOT
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Write tests that discard return values just to increase coverage.
- id: Assert values
  marker: MUST
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Assert the actual returned values — not merely that no error occurred.
- id: Add tests for new code
  marker: MUST
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Add tests for new code.
- id: Add tests for updated code
  marker: MUST
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Add tests for updated code.
- id: Troubleshooting unit test
  marker: MUST
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Add a unit test for any exploratory troubleshooting, even when a natural home for it does not exist.
- id: Refactor over mocking
  marker: SHOULD
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Refactor over mocking — if setup is painful, split into smaller domain models or focused interfaces.
- id: Setup pain as feedback
  marker: SHOULD
  group: All Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Treat setup pain as architectural feedback over reaching for mocks.
- id: One subject under test
  marker: MUST NOT
  group: Unit Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Include more than one subject under test or test the composition of objects within a unit test.
- id: No test case coupling
  marker: MUST NOT
  group: Unit Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Allow one test case to depend on another; every test case MUST be executable independently in any order.
- id: Integration Tests Are Black-Box
  marker: MUST
  group: Integration Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Test the runtime artifact being shipped via its public APIs, black box.
- id: Production Parity
  marker: MUST
  group: Integration Tests
  parent: Nothing Is Complete Without Verification
  body: |
    Simulate production instead of altering the behavior of the runtime artifact.
- id: Alert on broken tooling
  marker: MUST
  group: Quality Tooling & Shift Left
  parent: The Toolchain Is the Guardrail
  body: |
    Stop and alert if quality-measuring tools are not functioning or covering all code.
- id: No global lint changes
  marker: MUST NOT
  group: Quality Tooling & Shift Left
  parent: The Toolchain Is the Guardrail
  body: |
    Change global or project-wide linting rules (e.g., `biome.json`, `stylecop.json`, `stylecop.ruleset`, `tsconfig.json`, `golangci.yaml`).
- id: No global quality changes
  marker: MUST NOT
  group: Quality Tooling & Shift Left
  parent: The Toolchain Is the Guardrail
  body: |
    Change global or project-wide quality standards (e.g., `knip.json`, test coverage thresholds in `package.json`).
- id: No disabling via pragma
  marker: MUST NOT
  group: Quality Tooling & Shift Left
  parent: Shift Test Left
  body: |
    Disable linting rules via comments or pragmas (e.g., `// eslint-disable-next-line`, `@ts-ignore`, `/* @ts-expect-error */`).
- id: No committing generated code
  marker: MUST NOT
  group: Quality Tooling & Shift Left
  parent: The Toolchain Is the Guardrail
  body: |
    Commit generated code.
- id: Strict presets
  marker: MUST
  group: Quality Tooling & Shift Left
  parent: Shift Test Left
  body: |
    Use the strictest possible presets on linting and style.
- id: Fix over mute
  marker: PREFER
  group: Quality Tooling & Shift Left
  parent: Shift Test Left
  body: |
    Resolve every individual static analysis warning at its root cause over relaxing checks to allow changes through.
- id: Ask over hack
  marker: PREFER
  group: Quality Tooling & Shift Left
  parent: Shift Test Left
  body: |
    Seek architectural guidance to satisfy strict tooling rules over introducing workarounds.
- id: Shift left verifications
  marker: MUST
  group: Quality Tooling & Shift Left
  parent: Shift Test Left
  body: |
    Place a safeguard at the leftmost rung that can catch the error, and descend only when the rung above cannot. See [[Shift Test Left]].
- id: Enforce via static analysis
  marker: SHOULD
  group: Quality Tooling & Shift Left
  parent: Shift Test Left
  body: |
    Enable strict static analysis presets and compiler checks to enforce safeguards automatically.
- id: No optionality
  marker: MUST NOT
  group: Optionality
  parent: Optionality Drives Complexity
  body: |
    Use optional variables or parameters unless a framework or third-party library forces them.
- id: Prefer APIs without optionality
  marker: MUST
  group: Optionality
  parent: Optionality Drives Complexity
  body: |
    Use an API that has no optional parameters over on that has when choosing Code We Cannot Control.
- id: Overload per option combination
  marker: MUST
  group: Optionality
  parent: Optionality Drives Complexity
  body: |
    Provide an overload or an explicitly named method for each allowed combination of options instead of optional parameters.
- id: Forced optionality at perimeter
  marker: MUST
  group: Optionality
  parent: Optionality Drives Complexity
  body: |
    Handle optionality forced by Code We Cannot Control at the perimeter, in the statement that invokes it or receives its return, so no optional value travels inward.
- id: Accept unknown properties
  marker: MUST
  group: Robustness
  parent: Producer moves first
  body: |
    Accept input that carries properties you do not know and ignore them, so a producer can add a property before every consumer knows it.
- id: Generic parameters, specific returns
  marker: MUST
  group: Robustness
  parent: Producer moves first
  body: |
    Declare the most generic parameter types and the most specific return type a method or function can honour, so callers may pass more and receive no less than they need.
