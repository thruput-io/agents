definitions:
- id: Marker
  specification: |
    The RFC 2119 priority word that opens a rule. MUST and MUST NOT are absolute requirements. SHOULD and SHOULD NOT are requirements that may be set aside only with a stated, valid reason. MAY is optional. PREFER is a directional default: choose the named option over the alternative unless the alternative is demonstrably better here. Conflicts are resolved in favor of the rule with the higher-priority marker.
- id: Id
  specification: |
    The name of an entry, and the only stable handle for citing it. Ids are unique across every document, compared case-insensitively with whitespace normalized. In prose an id is cited as [[Id]].
- id: Group
  specification: |
    The topical cluster a rule belongs to, taken from the heading the rule sat under. It orders and clusters rules for readers and has no bearing on precedence.
- id: Parent
  specification: |
    The id of the entry directly above. Every entry below the root has exactly one parent.
- id: Purpose
  specification: |
    The stated reason for a change, component, or system, expressed as the benefit it delivers to [[Users]]. Purpose is measured in benefit to users, not to developers. Code is a subset of its Purpose: every part of the code traces to a part of the Purpose, and no part of the code reaches outside it.
- id: WHY
  specification: |
    Alias for [[Purpose]].
- id: Users
  specification: |
    Whoever consumes the software or system to fulfill a need: human end users, operators, external systems, or AI agents. Developers who write, call, or maintain the code are not users.
- id: Domain object
  specification: |
    A type in the domain layer that models a business concept, entity, or state and upholds its own invariants. Domain objects are immutable, are created only through a validating factory, and expose operations that accept and return other domain objects.
- id: Domain primitive
  specification: |
    A validated, immutable wrapper around a single raw value (value object, tiny type) that gives the value its domain meaning, so a malformed value or a transposed argument is a compile error. Raw primitives appear only at perimeters.
- id: Code We Cannot Control
  specification: |
    Code that is not part of the current code base and whose shape we cannot change: frameworks, APIs, libraries, and user input arriving through a user interface.
- id: Perimeter
  specification: |
    A point in our code that either invokes, or is invoked by, Code We Cannot Control.
- id: Illegal state
  specification: |
    A combination of values that the domain never defined as valid. It is made unrepresentable by choosing a type in which the combination cannot be constructed, rather than by checking for it at runtime.
- id: Simplicity ladder
  specification: |
    The ordered preference for how a need is met: no code; reuse code in this codebase; use what the platform or framework provides; add an external dependency; integrate an external tool or service; and only then write new code. Take the highest rung that applies and descend only when the rung above offers nothing viable. Every rung is gated by being available and maintained.
- id: Shift Left rung
  specification: |
    One of five places a defect can be caught, ordered from earliest and cheapest to latest and costliest: illegal states unrepresentable, static code analysis, unit tests, integration tests, end-to-end tests. A safeguard belongs at the leftmost rung able to catch the error.
- id: Evidence
  specification: |
    A verifiable reference that grounds a change or an assumption: a full URL to code on the main branch of an existing or public repository, a test in an existing repository, or a full URL to a specific section of an article or document. A practice recalled from experience is not evidence.
- id: Good Code
  specification: |
    Code that avoids a [[System Failed State]].
- id: Great Code
  specification: |
    Alias for [[Good Code]].
- id: Bad Code
  specification: |
    Code that drives the system toward a [[System Failed State]].
- id: Accuracy
  specification: |
    The degree to which the system does what [[Users]] need.
- id: Inaccurate
  specification: |
    The state where system behavior, calculations, or outputs diverge from what [[Users]] need, failing to fulfill their intended outcome.
- id: System Decay
  specification: |
    The progressive transition of a software system from a healthy state into one or more [[System Failed State]]s, caused by the accumulation of [[Bad Code]].
- id: System Failed State
  specification: |
    A non-operational state the software transitions into when bad code accumulates.
- id: Velocity Stagnation
  specification: |
    A [[System Failed State]] where the codebase becomes so complex or fragile that the team can no longer deliver value at a sustainable pace.
- id: Regression Cascades
  specification: |
    A [[System Failed State]] where fixing one bug consistently introduces new, unrelated bugs elsewhere in the application.
- id: Knowledge Dissipation
  specification: |
    A [[System Failed State]] where the codebase can still run, but no active team member understands how or why the core logic works.
- id: Deployment Paralysis
  specification: |
    A [[System Failed State]] where code changes are complete, but the system cannot be safely or reliably shipped to production due to brittle infrastructure, flaky tests, or massive merge conflicts.
- id: Value Failure
  specification: |
    A [[System Failed State]] where the system becomes [[Inaccurate]], failing to do what [[Users]] need.
- id: Architectural Direction
  specification: |
    The fold of every ADR, read from the highest-numbered downward: a later ADR supersedes an earlier one, so where ADRs are ambiguous or conflict, the first read holds. ADRs are immutable; a change is a new ADR, never an edit, because the history explains why decisions were made and why the project is designed the way it is. The Architectural Direction governs where the project is heading; it does not describe its current state.
- id: ADRs
  specification: |
    Alias for [[Architectural Direction]].
