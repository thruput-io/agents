<ul class="criteria">
{%- for criterion in include.criteria -%}
{%- for pair in criterion -%}
{%- assign kind = pair[0] -%}
{%- assign statement = pair[1] %}
  <li class="{{ kind }}"><span class="kind">{{ kind | capitalize }}</span>{% include prose.html text=statement %}</li>
{%- endfor -%}
{%- endfor %}
</ul>
