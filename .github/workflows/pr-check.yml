name: PR Check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  PROJECT_ROOT: ${{ github.workspace }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: "$PROJECT_ROOT/scripts/verify.sh"
      - run: npx --yes @agentplugins/cli@0.6.1 audit "$PROJECT_ROOT"

  build-site:
    uses: ./.github/workflows/build-site.yml
    with:
      artifact: site
