name: PR Check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  PROJECT_ROOT: ${{ github.workspace }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          "$PROJECT_ROOT/scripts/declared-ids.schema.sh" > "$PROJECT_ROOT/schemas/declared-ids.g.schema.json"
      - run: npx --yes @sourcemeta/jsonschema@17.0.0 lint "$PROJECT_ROOT/schemas" --resolve "$PROJECT_ROOT/schemas"
      - run: npx --yes @sourcemeta/jsonschema@17.0.0 metaschema "$PROJECT_ROOT/schemas" --resolve "$PROJECT_ROOT/schemas"
      - run: npx --yes @sourcemeta/jsonschema@17.0.0 validate "$PROJECT_ROOT/schemas/declared-ids.g.schema.json" "$PROJECT_ROOT/governance" --resolve "$PROJECT_ROOT/schemas"
      - run: npx --yes @agentplugins/cli@0.6.1 audit "$PROJECT_ROOT"

  build-site:
    uses: ./.github/workflows/build-site.yml
