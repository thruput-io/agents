name: PR Check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: scripts/declared-ids.schema.sh > schemas/declared-ids.schema.json
      - run: npx --yes @sourcemeta/jsonschema@17.0.0 lint schemas --resolve schemas
      - run: npx --yes @sourcemeta/jsonschema@17.0.0 metaschema schemas --resolve schemas
      - run: npx --yes @sourcemeta/jsonschema@17.0.0 validate schemas/declared-ids.schema.json governance --resolve schemas
      - run: npx --yes @agentplugins/cli@0.6.1 audit .
      - run: |
          cp -R web site
          cp -R governance site/_data
          cp -R schemas site/schemas
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site
      - run: npx --yes --package vnu-jar@26.9.30 vnu --skip-non-html _site
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --root-dir ${{ github.workspace }}/_site '_site/**/*.html'
      - uses: actions/upload-pages-artifact@v3
