name: PR Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate YAML Against Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate principles
        run: pipx run check-jsonschema --schemafile schemas/principles.schema.json principles.yaml

      - name: Validate rules
        run: pipx run check-jsonschema --schemafile schemas/rules.schema.json rules.yaml

      - name: Validate definitions
        run: pipx run check-jsonschema --schemafile schemas/definitions.schema.json definitions.yaml
