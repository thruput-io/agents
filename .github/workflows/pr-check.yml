name: PR Check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  PROJECT_ROOT: ${{ github.workspace }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: "$PROJECT_ROOT/scripts/verify.sh"

  opencode-install:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          npm --prefix "$PROJECT_ROOT/skills/pr-review" ci --no-audit --no-fund
          npm --prefix "$PROJECT_ROOT/skills/pr-review" run codegen
          "$PROJECT_ROOT/scripts/verify-opencode-install.sh"

  build-site:
    uses: ./.github/workflows/build-site.yml
    with:
      artifact: site
