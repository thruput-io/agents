name: CI Check

on:
  push:
    branches:
      - main
      - yaml-governance-documents
  pull_request:
    branches:
      - main
      - yaml-governance-documents

permissions:
  contents: read

jobs:
  validate:
    name: Validate Documents Against Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install the JSON Schema CLI
        uses: sourcemeta/jsonschema@v17.0.0

      - name: Validate documents
        run: scripts/validate.sh

  site:
    name: Build and Check the Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and check the site
        run: scripts/site.sh

      - name: Prove the checks reject a broken reference and a broken parent
        run: docs/plans/governance-site/tracer-bullets/broken-references/run.sh
