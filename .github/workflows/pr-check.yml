name: PR Check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: scripts/declared-ids.schema.sh > schemas/declared-ids.schema.json
      - run: npx --yes @sourcemeta/jsonschema@17.0.0 lint schemas --resolve schemas
      - run: npx --yes @sourcemeta/jsonschema@17.0.0 metaschema schemas --resolve schemas
      - run: npx --yes @sourcemeta/jsonschema@17.0.0 validate schemas/declared-ids.schema.json governance --resolve schemas
      - run: npx --yes @agentplugins/cli@0.6.1 audit .

  build-site:
    uses: ./.github/workflows/build-site.yml
