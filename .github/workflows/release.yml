name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  pages: write
  id-token: write

jobs:
  check:
    uses: ./.github/workflows/pr-check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          npm --prefix skills/pr-review ci --no-audit --no-fund
          ./scripts/pack-review-tool.sh dist/thruput-review-tool.tgz
          npx --yes semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  site:
    needs: release
    uses: ./.github/workflows/build-site.yml
    with:
      artifact: github-pages

  trigger-reviewer:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - id: distribute
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: reviewer
      - name: tell reviewer there is a release
        env:
          GH_TOKEN: ${{ steps.distribute.outputs.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY_OWNER/reviewer/dispatches" \
            -f event_type=release -f "client_payload[repository]=$GITHUB_REPOSITORY"

  pages:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - shell: bash
        run: curl -fsS "$PAGE_URL" | grep -F "<meta name=\"version\" content=\"$VERSION\">"
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          VERSION: ${{ needs.site.outputs.version }}
