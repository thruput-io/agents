name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  pages: write
  id-token: write

jobs:
  check:
    uses: ./.github/workflows/pr-check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  site:
    needs: release
    uses: ./.github/workflows/build-site.yml
    with:
      artifact: github-pages

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@thruput-io"
      - run: |
          version=$(git describe --tags | sed 's/^v//')
          npm --prefix skills/pr-review ci --no-audit --no-fund
          npm --prefix skills/pr-review run codegen
          rm -rf skills/pr-review/rules skills/pr-review/schemas
          cp -RL rules skills/pr-review/rules
          cp -RL schemas skills/pr-review/schemas
          npm --prefix skills/pr-review version "$version" --no-git-tag-version --allow-same-version
          npm --prefix skills/pr-review publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-opencode:
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pr_num=$(gh pr list -R "${{ github.repository }}" --state all --limit 1 --json number --jq '.[0].number')
          pr_url="https://github.com/${{ github.repository }}/pull/${pr_num}"
          docker build -t pr-review-opencode-e2e scripts/e2e-opencode
          docker run --rm \
            -e NODE_AUTH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -v "$PWD/scripts/e2e-opencode/run.sh:/usr/local/bin/e2e-run.sh:ro" \
            pr-review-opencode-e2e \
            /usr/local/bin/e2e-run.sh "$pr_url" "https://github.com/${{ github.repository }}" "opencode/hy4-flash-free"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - shell: bash
        run: curl -fsS "$PAGE_URL" | grep -F "<meta name=\"version\" content=\"$VERSION\">"
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          VERSION: ${{ needs.site.outputs.version }}
