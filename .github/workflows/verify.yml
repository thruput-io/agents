name: Verify

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify and Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate Declared IDs Schema
        run: scripts/declared-ids.schema.sh > schemas/declared-ids.schema.json

      - name: Lint Schemas
        run: npx --yes @sourcemeta/jsonschema@17.0.0 lint schemas --resolve schemas

      - name: Check Metaschema
        run: npx --yes @sourcemeta/jsonschema@17.0.0 metaschema schemas --resolve schemas

      - name: Validate Governance Schema
        run: npx --yes @sourcemeta/jsonschema@17.0.0 validate schemas/declared-ids.schema.json governance --resolve schemas

      - name: Run AgentPlugins Audit
        run: npx --yes @agentplugins/cli@0.6.1 audit .

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - name: Install Jekyll
        run: gem install jekyll jekyll-remote-theme

      - name: Assemble Site Source
        run: |
          mkdir "$RUNNER_TEMP/source"
          cp -R web/. "$RUNNER_TEMP/source"
          cp -R governance "$RUNNER_TEMP/source/_data"
          cp -R schemas "$RUNNER_TEMP/source/schemas"

      - name: Build Site
        run: jekyll build --source "$RUNNER_TEMP/source" --destination "$RUNNER_TEMP/public"

      - name: Validate Site HTML
        run: npx --yes html-validate@11.16.1 "$RUNNER_TEMP/public/**/*.html"

      - name: Check Site Links
        uses: lycheeverse/lychee-action@v2
        with:
          workingDirectory: ${{ runner.temp }}/public
          args: --offline --include-fragments --root-dir ${{ runner.temp }}/public '**/*.html'

      - name: Upload Site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/public
