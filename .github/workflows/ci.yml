name: CI Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Documents Against Schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate documents
        run: scripts/validate.sh

  site:
    name: Build and Check the Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and check the site
        run: scripts/site.sh governance "$RUNNER_TEMP/site"

  audit:
    name: Audit AgentPlugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run AgentPlugins Audit
        run: scripts/audit.sh
