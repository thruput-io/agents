name: Build Site

on:
  workflow_call:
    inputs:
      artifact:
        description: The name the built site is uploaded under
        required: true
        type: string
    outputs:
      version:
        description: The version the built site carries in its meta header
        value: ${{ jobs.build-site.outputs.version }}

permissions:
  contents: read

env:
  PROJECT_ROOT: ${{ github.workspace }}

jobs:
  build-site:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        run: |
          version=$(git describe --tags | sed 's/^v//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cp -R "$PROJECT_ROOT/web" "$PROJECT_ROOT/site"
          cp -R "$PROJECT_ROOT/rules" "$PROJECT_ROOT/site/_data"
          mkdir -p "$PROJECT_ROOT/site/rules"
          cp "$PROJECT_ROOT/rules/"*.yaml "$PROJECT_ROOT/site/rules/"
          cp -R "$PROJECT_ROOT/schemas" "$PROJECT_ROOT/site/schemas"
          printf 'version: %s\n' "$version" > "$PROJECT_ROOT/site/_data/release.yml"
      - run: npx --yes @sourcemeta/jsonschema@17.0.0 validate "$PROJECT_ROOT/schemas/repository/release.schema.json" "$PROJECT_ROOT/site/_data/release.yml" --resolve "$PROJECT_ROOT/schemas"
      - uses: actions/jekyll-build-pages@v1
        with:
          source: site
          destination: _site
      - run: npx --yes --package vnu-jar@26.10.12 vnu --skip-non-html --verbose "$PROJECT_ROOT/_site"
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          failIfEmpty: true
          format: json
          args: >-
            --verbose
            --no-progress
            --offline
            --include-fragments
            --root-dir '${{ env.PROJECT_ROOT }}/_site'
            '${{ env.PROJECT_ROOT }}/_site/**/*.html'
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ inputs.artifact }}
          path: ${{ env.PROJECT_ROOT }}/_site
