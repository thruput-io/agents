axioms:
  single-source-of-truth:
    title: Single Source of Truth
    body: |
      Every piece of information is defined exactly once. Competing definitions is a source of confusion.
  shift-left:
    title: Shift Left
    body: |
      Do every activity at the earliest point where it can be done. The earlier a question is answered, a decision is made, or a defect is found, the cheaper and more certain the outcome.
  simplicity:
    title: Simplicity
    body: |
      Simple solutions are better than complex.
  speed-through-discipline:
    title: Speed Through Discipline
    body: |
      We do not move fast and break things. We move fast because we build things right. Skipping tests, security, or rigour in automation is not a shortcut but debt, and a disciplined foundation is what makes the highest true speed available at all.
  excellence-through-transparency:
    title: Excellence Through Transparency
    body: |
      We hire for talent and grow by collaboration. Staying humble, surfacing blockers early, and saying plainly what we do not know makes the product the sum of our competence, rather than the competence of whoever touched it last.
  outcome-over-output:
    title: Outcome Over Output
    body: |
      The job is not to check off a requirements list. It is to solve a problem. We value customer collaboration over a rigid plan, and the path that delivers the most meaningful impact over the easy one.
  joy-through-craft:
    title: Joy Through Craft
    body: |
      Working this way is, quite simply, the most fun. Doing things the right way, with discipline, transparency, and purpose, is the most rewarding way to spend the time. Fun is not a distraction from the craft; it is the byproduct of mastering it.
  leverage:
    title: Leverage
    body: |
      A tool multiplies the competence applied to it and supplies no judgement of its own. It magnifies whatever is already there, so the operator decides what the outcome is and the tool decides only how fast it arrives.
  orphans:
    title: Orphans
    body: |
      The holding axiom for principles that no stated axiom clearly grounds.

      A principle that interprets this axiom is a prompt, not a resolution: either state the axiom the principle actually rests on and re-point the principle at it, or fold the principle into one that has a ground.
