rationales:
- id: Robustness Principle
  parent: Easy to Change
  body: |
    Be conservative in what you send and liberal in what you accept ([RFC 1122 § 1.2.2](https://datatracker.ietf.org/doc/html/rfc1122#page-12), Postel's law). A producer emits exactly the shape it defines; a consumer takes what it needs from what it receives and is not disturbed by what it does not know.

    This includes Martin Fowler's [Tolerant Reader](https://martinfowler.com/bliki/TolerantReader.html): with one producer and many consumers, the producer is the single source of the shape and moves first, its consumers catch up at their own pace, and nothing breaks in between. Gating the producer on the slowest consumer is the unmaintainable order.
  solutions:
  - marker: SHOULD
    body: |
      Ship the expanded contract, migrate its consumers, then remove what is left over, so every step deploys on its own (Danilo Sato, [Parallel Change](https://martinfowler.com/bliki/ParallelChange.html)).
  - marker: MAY
    body: |
      Let consumers publish the parts of the contract they rely on, so the producer sees what a change would break before it ships (Ian Robinson, [Consumer-Driven Contracts](https://martinfowler.com/articles/consumerDrivenContracts.html)).
- id: Code is a liability, not an asset
  parent: Simplicity
  body: |
    Simplicity is the fit between a job and the tools and strategies chosen to do it: a solution is simple when it carries nothing the job does not call for, and complex in proportion to what it carries beyond that. Every line carries the ongoing cost of being read, supported, and updated as the ecosystem around it evolves, and is worth that cost only where it meets a user need ([Software Engineering at Google, Why Deprecate?](https://abseil.io/resources/swe-book/html/ch15.html#why_deprecatequestion_mark)). Edsger Dijkstra: if we count lines of code, "we should not regard them as 'lines produced' but as 'lines spent'" ([EWD1036](https://www.cs.utexas.edu/~EWD/transcriptions/EWD10xx/EWD1036.html)), and Jeff Atwood: "Every new line of code you willingly bring into the world is code that has to be debugged, code that has to be read and understood, code that has to be supported" ([The Best Code is No Code At All](https://blog.codinghorror.com/the-best-code-is-no-code-at-all/)). Ron Jeffries: "the best way to have fewer bugs is to implement less code."
  solutions:
  - marker: SHOULD
    body: |
      Record, for every level of the [[Development Stack]] above the one chosen, the search performed and what it found.
  - marker: SHOULD
    body: |
      Choose the technology the team already operates before adopting a new one.
- id: Validated user need over speculative scope
  parent: Great Products Require Users
  body: |
    Code outside the stated [[Purpose]] is not free ([Ron Jeffries, You're NOT Gonna Need It](https://ronjeffries.com/xprog/articles/practices/pracnotneed/)). Martin Fowler's [Yagni](https://martinfowler.com/bliki/Yagni.html) names four costs of speculative scope: building it, delaying real features, carrying its complexity, and repairing it when the guess proves wrong. Google's [Small CLs](https://google.github.io/eng-practices/review/developer/small-cls.html) keeps each [[Change]] to one self-contained purpose so every part is reviewed and verified against what [[Users]] actually need, and Saltzer and Kaashoek's [Principle of Least Astonishment](https://en.wikipedia.org/wiki/Principle_of_least_astonishment) extends that discipline to how the system behaves: features and interfaces match the mental model [[Users]] bring, rather than surprising them with unasked-for behavior or hidden side effects.
  solutions:
  - marker: SHOULD
    body: |
      State the [[User]] need before the [[Change]] is reviewed, so every part of the [[Change]] can be traced to it.
- id: Duplication drifts
  parent: Single Source of Truth
  body: |
    When the same piece of knowledge is written down in two places, the two copies drift apart on the first change that forgets one of them. Hunt and Thomas's [The Pragmatic Programmer](https://pragprog.com/tips/) distinguishes duplication of authoritative knowledge—which always belongs in one [[Representation]]—from coincidental similarity between independent pieces of code. Keeping one authoritative [[Representation]] and deriving or referencing everything else eliminates synchronization bugs at the source.
  solutions:
  - marker: SHOULD
    body: |
      Derive secondary artifacts from the authoritative [[Representation]] in the build rather than maintaining copies by hand.
- id: Intent lives where it is checked
  parent: Single Source of Truth
  body: |
    A comment is prose no tool checks, and it drifts from the code it describes. Every [[Comment intent]] belongs where drift is caught: [[Clarification]] in intent-revealing names, focused [[Function]]s, or [[Test]]s; [[Procrastination]] in a [[Failing test]], smaller [[Change]]s, or an explicit plan; [[Architectural decision]] in an [[Architectural Direction]] record under `docs/adrs/` conforming to [adr.schema.json](https://thruput.se/agents/schemas/repository/adr.schema.json) (Michael Nygard, [Documenting Architecture Decisions](https://www.cognitect.com/blog/2011/11/15/documenting-architecture-decisions)); [[Usage guidance]] in user documentation or a README; and [[Apology or confession]] by fixing the design flaw or pinning the limitation with a [[Failing test]].
  solutions:
  - marker: SHOULD
    body: |
      Name each test after the behavior it pins, so the tests read as the specification.
- id: One concern, one owner
  parent: Easy to Change
  body: |
    Edsger Dijkstra named separation of concerns the only reliable way to order one's thoughts ([EWD447](https://www.cs.utexas.edu/~EWD/transcriptions/EWD04xx/EWD447.html)); David Parnas made it structural: each module hides one decision likely to change. When a behavior has one owner in one layer, changing it touches one place and one set of tests. Scattering it saves minutes today and costs a hunt, and a missed copy, on every future change.
  solutions:
  - marker: SHOULD
    body: |
      Hide each design decision likely to change behind one module interface.
  - marker: SHOULD
    body: |
      Keep configuration out of the code and read it from the environment ([The Twelve-Factor App, III. Config](https://12factor.net/config)).
  - marker: SHOULD
    body: |
      Keep concerns separate where merging them would save lines; the lines saved are paid back on every later change.
- id: Polymorphism over conditionals
  parent: Easy to Change
  body: |
    Repeated `if`/`else` or `switch` [[Branching logic]] scatters knowledge of variants across every caller: adding a variant means hunting down and editing every conditional. Bertrand Meyer's [Open/Closed Principle](https://en.wikipedia.org/wiki/Open%E2%80%93closed_principle) resolves this by keeping modules open for extension and closed for modification—new behavior arrives as a new implementation of an [[Interface]], not a new branch in existing callers. Craig Larman's GRASP Polymorphism and Martin Fowler's [Replace Conditional with Polymorphism](https://refactoring.com/catalog/replaceConditionalWithPolymorphism.html) assign the varying behavior to the type for which it varies, while [Tell, Don't Ask](https://martinfowler.com/bliki/TellDontAsk.html) keeps callers from querying a [[Domain object]]'s state to decide on its behalf. Decisions about which variant to run, which [[Feature]] to wire, or how to assemble optional parts belong once at the [[Perimeter]]—inside a [[Factory]], [[Feature]], or [[Builder]]—so core domain and application logic executes linearly through polymorphic contracts.
  solutions:
  - marker: SHOULD
    body: |
      Select the polymorphic implementation once at the [[Perimeter]] in a [[Factory]], [[Feature]], or [[Builder]], and pass the behavior inward through an [[Interface]].
  - marker: SHOULD
    body: |
      Tell a [[Domain object]] what action to perform through a [[Domain method]] rather than querying its state to branch in the caller.
- id: The Practical Test Pyramid
  parent: Shift Left
  body: |
    Every level of the [[Test Pyramid]] is a mechanism for stopping defects, ordered from the base—earliest, cheapest, and most certain—to the top—latest, costliest, and least certain: [[Type system]] (Yaron Minsky's "[[Make illegal states unrepresentable]]" and Alexis King's [Parse, don't validate](https://lexi-lambda.github.io/blog/2019/11/05/parse-don-t-validate/), where no [[Illegal state]] can be held), [[Static code analysis]] ([[Compiler]], type checker, and linter rejecting code before anything runs), [[Unit test]]s, [[Narrow integration test]]s ([Martin Fowler, IntegrationTest](https://martinfowler.com/bliki/IntegrationTest.html)), black-box [[Integration test]]s of the shipped [[Runtime artifact]], [[End-to-end test]]s, and [[Manual test]]s ([Ham Vocke, The Practical Test Pyramid](https://martinfowler.com/articles/practical-test-pyramid.html)). The higher the level, the fewer the tests; each safeguard belongs on the lowest level that can catch the error.
- id: Crash, don't guess
  parent: Shift Left
  body: |
    A program that continues past an unexpected state runs on a guess. Jim Shore's [Fail Fast](https://www.jamesshore.com/v2/blog/2004/fail-fast): code that works around errors fails mysteriously later; code that stops at once reveals the defect where it lives. Joe Armstrong's Erlang thesis: skip the defensive code, let the process die, recover elsewhere. [RFC 9413](https://www.rfc-editor.org/rfc/rfc9413.html) shows that tolerated faults become permanent contracts.
  solutions:
  - marker: SHOULD
    body: |
      Make processes safe to kill at any moment, so a crash costs nothing but a restart ([The Twelve-Factor App, IX. Disposability](https://12factor.net/disposability)).
  - marker: SHOULD
    body: |
      Leave recovery to a supervisor outside the failing process.
- id: Anti-Corruption Layer
  parent: Easy to Change
  body: |
    [[Code We Cannot Control]] speaks a [[Foreign shape]]. Alistair Cockburn's [Hexagonal Architecture](https://alistair.cockburn.us/hexagonal-architecture/) and Eric Evans's [Anti-Corruption Layer](https://learn.microsoft.com/en-us/azure/architecture/patterns/anti-corruption-layer) isolate translation in dedicated adapters at the [[Perimeter]], preventing external models and null references (Tony Hoare, [Null References: The Billion Dollar Mistake](https://www.infoq.com/presentations/Null-References-The-Billion-Dollar-Mistake-Tony-Hoare/)) from leaking inward.
  solutions:
  - marker: SHOULD
    body: |
      Give every [[External system]] its own adapter behind a port [[Interface]].
  - marker: SHOULD
    body: |
      Introduce an anti-corruption layer at the [[Perimeter]] where a [[Foreign shape]] diverges from the domain model.
- id: Encapsulation
  parent: Shift Left
  body: |
    An [[Encapsulated type]] with a single [[Validating path of creation]] makes [[Illegal states]] unrepresentable at compile time (Yaron Minsky, [Effective ML Revisited](https://blog.janestreet.com/effective-ml-revisited/); Scott Wlaschin, [Designing with types](https://fsharpforfunandprofit.com/posts/designing-with-types-making-illegal-states-unrepresentable/)). Any second creation path or unencapsulated [[Primitive]] hands validation back to every caller.
  solutions:
  - marker: SHOULD
    body: |
      Use every typing mechanism the language offers to give each [[Type]] a single [[Validating path of creation]].
  - marker: SHOULD
    body: |
      Replace [[Optionality]] and [[Primitive Obsession]] with opaque [[Encapsulated type]]s and retire [[Test]]s that guarded against unreachable states.
  - marker: MAY
    body: |
      In untyped languages, mint a naming prefix for values produced by a [[Factory]] and enforce it with a [[Lint rule]].
  - marker: SHOULD
    body: |
      Hide a [[Type]]'s underlying representation outside its [[Module]] via branded or nominal types rather than type aliases.
  - marker: SHOULD
    body: |
      Encode state transitions in the [[Type system]] so each transition consumes the prior state [[Type]] and returns the next.
  - marker: SHOULD
    body: |
      Enforce collection [[Invariant]]s (such as non-emptiness, uniqueness, and bounds) in a dedicated [[Encapsulated type]].
  - marker: SHOULD
    body: |
      Attach compile-time predicates or refinement types where the ecosystem supports them.
  - marker: MAY
    body: |
      Implement the language's comparison [[Interface]] on a [[Domain object]] rather than comparing its [[Primitive]]s.
- id: Optionality Drives Complexity
  parent: Simplicity
  body: |
    Each optional flag doubles the paths a function can take, and most of them are never tested (Pete Hodgson, [Feature Toggles](https://martinfowler.com/articles/feature-toggles.html)). Martin Fowler's [FlagArgument](https://martinfowler.com/bliki/FlagArgument.html): a named operation states intent where a bare boolean hides it. Robert Harper's [Boolean Blindness](https://existentialtype.wordpress.com/2011/03/15/boolean-blindness/): a flag carries no meaning of its own.
  solutions:
  - marker: SHOULD
    body: |
      Make the toggle a strategy so that it encodes all options it controls
  - marker: SHOULD
    body: |
      Make overload or specific behavior [[Explicitly named method]]s instead of optional flags
- id: Tests prove behavior, not execution
  parent: Without Verification It Is Worthless
  body: |
    A line that runs under test is not a line that is checked. Martin Fowler's [AssertionFreeTesting](https://martinfowler.com/bliki/AssertionFreeTesting.html) describes suites with full coverage that verified nothing; Inozemtseva and Holmes found coverage predicts little about fault detection once suite size is controlled for. A test that asserts outcomes is an executable specification that documents and guards behavior on every commit.
  solutions:
  - marker: SHOULD
    body: |
      Run mutation testing to show that the tests fail when the code is wrong ([State of Mutation Testing at Google](https://research.google.com/pubs/archive/46584.pdf)).
  - marker: SHOULD
    body: |
      Treat painful [[Test setup]] as a design signal: split the subject into smaller domain models or focused interfaces before reaching for a mock.
  - marker: SHOULD
    body: |
      Almost all code has tools for verification; make sure they are used inside the project.
- id: Make the wrong thing fail
  parent: Shift Left
  body: |
    Documents advise; the build decides. Compiler strictness, linters, and thresholds live in the self-testing build ([Continuous Integration](https://martinfowler.com/articles/continuousIntegration.html)), where every change, by any [[Developer]], meets the same bar. As in Toyota's jidoka, an abnormality stops the line instead of travelling downstream. A gate that is relaxed is a broken window: it tells everyone the standard is gone.
  solutions:
  - marker: SHOULD
    body: |
      Run the same build locally and in the pipeline, so a change meets one bar wherever it runs.
  - marker: SHOULD
    body: |
      Let each tool write its report untouched, and compare the report against the thresholds in a separate step.
  - marker: SHOULD
    body: |
      Resolve a [[Static code analysis]] warning at its root cause; where the code cannot satisfy a strict rule, seek architectural guidance, never a workaround.
  - marker: SHOULD
    body: |
      Enable the strictest static-analysis presets and compiler checks the ecosystem offers, so safeguards are enforced without review.
- id: The practitioner decides the outcome
  parent: Competence Applied Is Leverage
  body: |
    Automation takes over routine work and leaves the [[Practitioner]] with essential judgement (Lisanne Bainbridge, [Ironies of Automation](https://doi.org/10.1016/0005-1098(83)90046-8); Fred Brooks, [No Silver Bullet](https://worrydream.com/refs/Brooks_1986_-_No_Silver_Bullet.pdf)). AI tools disseminate codified practice to novices ([Generative AI at Work](https://www.nber.org/papers/w31161)) but slow experienced [[Developer]]s when unguided ([METR Early-2025 Study](https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/)); articulating explicit [[Coding standard]]s is what turns tool speed into [[Quality]].
  solutions:
  - marker: SHOULD
    body: |
      Record every [[Coding standard]] in these governance documents before handing it to an [[AI agent]] or tool.
  - marker: SHOULD
    body: |
      Keep rules, prompts, harnesses, and verification pipelines under repository control rather than relying on vendor defaults.
  - marker: SHOULD
    body: |
      Verify tool-generated changes with the same [[Test]]s and [[Static code analysis]] as human changes to prove [[Correctness]].
- id: Environment parity
  parent: Without Verification It Is Worthless
  body: |
    Gaps between local, test, and production [[Environment]]s hide defects until deployment ([The Twelve-Factor App, X. Dev/prod parity](https://12factor.net/dev-prod-parity)). Provisioning every [[Environment]] from version control and bootstrapping via a single command ([Scripts to Rule Them All](https://github.blog/engineering/scripts-to-rule-them-all/)) eliminates manual drift.
  solutions:
  - marker: SHOULD
    body: |
      Provision local, staging, and production [[Environment]]s from the same infrastructure-as-code definition.
  - marker: SHOULD
    body: |
      Execute the shipped [[Runtime artifact]] itself locally and in [[Integration test]]s rather than a stand-in.
- id: Telemetry over guesswork
  parent: Without Verification It Is Worthless
  body: |
    A behavior shipped without a [[Signal]] is unverified in production. Instrumenting the four golden signals—latency, traffic, errors, and saturation ([Monitoring Distributed Systems](https://sre.google/sre-book/monitoring-distributed-systems/))—in the same [[Change]] surfaces regressions before [[Users]] report them.
  solutions:
  - marker: SHOULD
    body: |
      Instrument every service for latency, traffic, errors, and saturation before its initial deployment.
  - marker: SHOULD
    body: |
      Alert on symptoms [[Users]] experience and retain cause-level [[Signal]]s for diagnosis.
- id: What wins when values collide
  parent: Quality Uncompromised
  body: |
    Each [[Software quality axis]] ([ISO/IEC 25010](https://iso25000.com/index.php/en/iso-25000-standards/iso-25010)) is challenged by a [[Competing good]], and when they collide the axis wins: [[Correctness]] and [[Currency of Tools and Libraries]] over [[Feature Rich]]; [[Maintainability]] and [[Readability]] over [[Performance]]; [[Readability]], [[Automation]], and [[Guardrails Against Doing the Wrong Thing]] over [[Well documented]]; [[Testability]] and reproducible [[Automation]] over [[User Friendly]] graphical interfaces that resist automated testing and scripting; [[Structural simplicity]] over [[Industry Standard]]; and [[True Test Coverage]] over [[Measured Coverage]].
  solutions:
  - marker: SHOULD
    body: |
      Cite the specific [[Software quality axis]] in review findings so trade-offs are evaluated against the axis.
  - marker: SHOULD
    body: |
      Establish [[Ease of Doing the Right Thing]] first and point [[Guardrails Against Doing the Wrong Thing]] at that path.
- id: Agree at the boundary
  parent: Single Source of Truth
  body: |
    When two sides of a boundary define shapes independently, they drift until production fails. A single independent [[Contract]] binds both sides (Bertrand Meyer, [Design by Contract](https://www.eiffel.org/doc/eiffel/ET-_Design_by_Contract_%28tm%29,_Assertions_and_Exceptions); [OpenAPI Design-First Guidance](https://learn.openapis.org/best-practices.html); [Protocol Buffers](https://protobuf.dev/overview/)).
  solutions:
  - marker: SHOULD
    body: |
      Generate both sides of a boundary from the [[Contract]] rather than writing either by hand.
  - marker: SHOULD
    body: |
      Validate running code against the [[Contract]] in the build so drift fails before merge.
  - marker: MAY
    body: |
      Publish the [[Contract]] as an independently versioned artifact for consumers.
- id: Clarity over cleverness
  parent: Code Is Written for People
  body: |
    A line of code is written once and read many times: by the reviewer, by the next [[Developer]], by whoever is on call when it fails. Professionals spend about 58 percent of their working time understanding code ([Xia et al., IEEE TSE 2018](https://doi.org/10.1109/TSE.2017.2734091)), and "code is read much more often than it is written" ([PEP 8](https://peps.python.org/pep-0008/#a-foolish-consistency-is-the-hobgoblin-of-little-minds)). Following the ecosystem's conventions and the [[Surrounding code]] lets a reader predict structure instead of decoding it ([The Rails Doctrine](https://rubyonrails.org/doctrine#convention-over-configuration)), and removing everything superfluous keeps each unit within human working memory ([Brian Kernighan, The Elements of Programming Style](https://en.wikipedia.org/wiki/The_Elements_of_Programming_Style); [Antoine de Saint-Exupéry](https://en.wikiquote.org/wiki/Antoine_de_Saint-Exup%C3%A9ry)). The reader's cost decides how code is shaped, and [[Readability]] is the first [[Software quality axis]] a reader meets.
  solutions:
  - marker: SHOULD
    body: |
      Shape every unit of code—a file, a type, a function—to be read in one sitting by a reader who has not seen it before.
  - marker: SHOULD
    body: |
      Cite the convention followed: the section of the style guide, or the neighboring code it mirrors ([Google Engineering Practices](https://google.github.io/eng-practices/review/reviewer/looking-for.html)).
- id: Premature optimization and Jackson's rules
  parent: Code Is Written for People
  body: |
    Donald Knuth asked that we stop "imagining that our main task is to instruct a computer what to do" and "concentrate rather on explaining to human beings what we want a computer to do" ([Literate Programming, 1984](http://www.literateprogramming.com/knuthweb.pdf)); Abelson and Sussman put it as "programs must be written for people to read, and only incidentally for machines to execute" ([SICP, preface](https://mitp-content-server.mit.edu/books/content/sectbyfn/books_pres_0/6515/sicp.zip/full-text/book/book-Z-H-7.html)). Knuth warned that "we should forget about small efficiencies, say about 97% of the time: premature optimization is the root of all evil. Yet we should not pass up our opportunities in that critical 3%"—and that critical three percent is found by measurement, "only after that code has been identified" ([Computing Surveys 1974, p. 268](https://www.gwern.net/doc/cs/algorithm/1974-knuth.pdf)). Michael A. Jackson codified the discipline in two rules ([Principles of Program Design, 1975](https://en.wikipedia.org/wiki/Program_optimization#When_to_optimize)): Rule 1 is "Don't do it"; Rule 2 (for experts only) is "Don't do it yet—that is, not until you have a perfectly clear and unoptimized solution" ([Kent Beck, Make It Work, Make It Right, Make It Fast](https://wiki.c2.com/?MakeItWorkMakeItRightMakeItFast)). A clear, well-decomposed architecture is the prerequisite to profiling: you cannot isolate or replace a bottleneck in tangled code.
  solutions:
  - marker: SHOULD
    body: |
      Measure before optimizing, and optimize only the bottleneck the measurement names.
- id: Amdahl's Law and the I/O-bound reality
  parent: Simplicity
  body: |
    Gene Amdahl's law ([AFIPS 1967](https://en.wikipedia.org/wiki/Amdahl%27s_law)) bounds the speedup of any system by the fraction of time spent in the part being improved. In enterprise software, execution time is dominated by I/O—database queries, filesystem access, and [[Calls over the network]] taking milliseconds to hundreds of milliseconds—while [[In-memory operation]]s execute in nanoseconds, representing promilles of the total latency budget. Micro-optimizing [[In-memory operation]]s yields near-zero system return while trading away [[Readability]] and [[Maintainability]]; real [[Performance]] gains come from eliminating redundant I/O and batching [[Calls over the network]].
  solutions:
  - marker: SHOULD
    body: |
      Group [[Calls over the network]] together and minimize round-trips.
