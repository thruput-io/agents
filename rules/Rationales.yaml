rationales:
- id: Robustness Principle
  parent: Easy to Change
  body: |
    A producer emits the shape the producer defines. A consumer consumes required data and ignores unrecognized fields. The producer advances contract changes without gating deployments on consumer migrations.
  references:
  - id: RFC 1122 § 1.2.2
    uri: https://datatracker.ietf.org/doc/html/rfc1122#page-12
    quote: "Be conservative in what you send and liberal in what you accept"
  - id: Tolerant Reader
    uri: https://martinfowler.com/bliki/TolerantReader.html
  - id: Parallel Change
    uri: https://martinfowler.com/bliki/ParallelChange.html
  - id: Consumer-Driven Contracts
    uri: https://martinfowler.com/articles/consumerDrivenContracts.html
  solutions:
  - body: |
      A release expands the contract, migrates consumers, and removes deprecated fields in independent deployments.
  - body: |
      Consumers publish contract expectations to alert the producer before breaking changes deploy.
- id: Code is a liability, not an asset
  parent: Simplicity
  body: |
    Simplicity is the fit between a requirement and the chosen implementation. Every line of code incurs ongoing maintenance cost and delivers value only by satisfying a user need.
  references:
  - id: Software Engineering at Google, Why Deprecate?
    uri: https://abseil.io/resources/swe-book/html/ch15.html#why_deprecatequestion_mark
  - id: EWD1036
    uri: https://www.cs.utexas.edu/~EWD/transcriptions/EWD10xx/EWD1036.html
    quote: "we should not regard them as 'lines produced' but as 'lines spent'"
  - id: The Best Code is No Code At All
    uri: https://blog.codinghorror.com/the-best-code-is-no-code-at-all/
    quote: "Every new line of code you willingly bring into the world is code that has to be debugged, code that has to be read and understood, code that has to be supported"
  solutions:
  - body: |
      The architectural record documents the evaluation of development stack layers above the selected technology.
  - body: |
      The team selects existing operational technology before adopting a new tool.
- id: Validated user need over speculative scope
  parent: Great Products Require Users
  body: |
    Code outside the stated purpose incurs construction, maintenance, and defect costs. Each change addresses one self-contained purpose verified against validated user needs. System interfaces match user expectations without unrequested behavior or hidden side effects.
  references:
  - id: Yagni
    uri: https://martinfowler.com/bliki/Yagni.html
  - id: Small CLs
    uri: https://google.github.io/eng-practices/review/developer/small-cls.html
  - id: Principle of Least Astonishment
    uri: https://en.wikipedia.org/wiki/Principle_of_least_astonishment
  solutions:
  - body: |
      Each change description states the user need before review to establish traceability for every modification.
- id: Duplication drifts
  parent: Single Source of Truth
  body: |
    Duplicate representations of authoritative knowledge diverge over time. Every domain concept resides in exactly one authoritative representation. Secondary artifacts derive from or reference the authoritative representation.
  references:
  - id: The Pragmatic Programmer
    uri: https://pragprog.com/tips/
  solutions:
  - body: |
      Build processes generate secondary artifacts from the authoritative representation.
- id: Intent lives where it is checked
  parent: Single Source of Truth
  body: |
    Unchecked prose comments drift from code. Verified names, automated tests, and architectural decision records preserve design intent within enforceable contexts.
  references:
  - id: Documenting Architecture Decisions
    uri: https://www.cognitect.com/blog/2011/11/15/documenting-architecture-decisions
  solutions:
  - body: |
      Each test name expresses the exact behavior under verification to provide an executable specification.
- id: One concern, one owner
  parent: Easy to Change
  body: |
    Each module encapsulates one distinct concern and hides one design decision. Every behavior has one owner in one architectural layer. Modifications to a concern touch one module and its focused tests.
  references:
  - id: EWD447
    uri: https://www.cs.utexas.edu/~EWD/transcriptions/EWD04xx/EWD447.html
  - id: The Twelve-Factor App, III. Config
    uri: https://12factor.net/config
  solutions:
  - body: |
      A single module interface encapsulates each volatile design decision.
  - body: |
      Application code reads configuration from the deployment environment.
  - body: |
      Modules maintain separation of concerns even when consolidation decreases immediate line count.
- id: Polymorphism over conditionals
  parent: Easy to Change
  body: |
    Repeated conditionals scatter variant handling across callers. New behavior extends an interface rather than modifying existing caller branches. Core domain logic executes linearly through polymorphic interfaces configured at the perimeter.
  references:
  - id: Open/Closed Principle
    uri: https://en.wikipedia.org/wiki/Open%E2%80%93closed_principle
  - id: Replace Conditional with Polymorphism
    uri: https://refactoring.com/catalog/replaceConditionalWithPolymorphism.html
  - id: Tell, Don't Ask
    uri: https://martinfowler.com/bliki/TellDontAsk.html
  solutions:
  - body: |
      Perimeter factories and builders resolve polymorphic implementations and supply behavior through interfaces.
  - body: |
      Callers invoke domain methods directly on domain objects without querying internal state.
- id: The Practical Test Pyramid
  parent: Shift Left
  body: |
    Automated test suites maintain many fast unit tests, fewer coarse integration tests, and minimal end-to-end tests. Strong type systems eliminate invalid states before test execution. Lower verification layers deliver faster feedback with lower maintenance cost.
  references:
  - id: The Practical Test Pyramid
    uri: https://martinfowler.com/articles/practical-test-pyramid.html
    quote: "Write lots of small and fast unit tests. Write some more coarse-grained tests and very few high-level tests that test your application from end to end"
  - id: Parse, don't validate
    uri: https://lexi-lambda.github.io/blog/2019/11/05/parse-don-t-validate/
- id: Crash, don't guess
  parent: Shift Left
  body: |
    A program terminates immediately upon encountering an unexpected state. Defensive workarounds obscure root causes and establish unintended contracts. External supervisors manage process restart and fault recovery.
  references:
  - id: Fail Fast
    uri: https://www.jamesshore.com/v2/blog/2004/fail-fast
  - id: RFC 9413
    uri: https://www.rfc-editor.org/rfc/rfc9413.html
  - id: The Twelve-Factor App, IX. Disposability
    uri: https://12factor.net/disposability
  solutions:
  - body: |
      Processes maintain disposability so termination requires only an immediate restart.
  - body: |
      An external supervisor handles recovery outside the failing process.
- id: Translate at the door
  parent: Shift Left
  body: |
    Foreign models translate into internal domain types at boundary ports. The perimeter parses external payloads into encapsulated types that exclude invalid states. Dedicated adapters isolate external dependency upgrades from internal domain logic.
  references:
  - id: Hexagonal Architecture
    uri: https://alistair.cockburn.us/hexagonal-architecture/
  - id: "Null References: The Billion Dollar Mistake"
    uri: https://www.infoq.com/presentations/Null-References-The-Billion-Dollar-Mistake-Tony-Hoare/
  - id: Anti-Corruption Layer
    uri: https://learn.microsoft.com/en-us/azure/architecture/patterns/anti-corruption-layer
  solutions:
  - body: |
      Each external system interfaces through a dedicated adapter behind a port.
  - body: |
      An anti-corruption layer translates schemas when foreign models diverge from domain semantics.
- id: Encapsulation
  parent: Shift Left
  body: |
    An encapsulated type with one validating path of creation makes invalid states unrepresentable. Primitive values fold into domain types at system boundaries. Callers rely on validated types rather than repeating primitive checks.
  references:
  - id: Effective ML Revisited
    uri: https://blog.janestreet.com/effective-ml-revisited/
  - id: Designing with types
    uri: https://fsharpforfunandprofit.com/posts/designing-with-types-making-illegal-states-unrepresentable/
  solutions:
  - body: |
      Each domain type exposes exactly one validating path of creation.
  - body: |
      Opaque types replace primitive obsession and eliminate tests that guard against unreachable states.
  - body: |
      Untyped environments use prefix conventions enforced by linters to denote validated factory outputs.
  - body: |
      Branded types and newtypes hide underlying representations and prevent mixing of semantically distinct values.
  - body: |
      Type-level state transitions consume preceding states and produce succeeding states to prevent invalid operations at compile time.
  - body: |
      First-class collections enforce invariants including ordering, non-emptiness, and bounds within the type definition.
  - body: |
      Compile-time predicates and refinement types verify domain invariants during compilation.
  - body: |
      Domain objects implement standard comparison interfaces rather than exposing primitive fields for external evaluation.
- id: Optionality Drives Complexity
  parent: Simplicity
  body: |
    Each boolean flag doubles execution paths within a function. Distinct named methods express operational intent without parameter flags. Strategy types encapsulate behavioral variants.
  references:
  - id: Feature Toggles
    uri: https://martinfowler.com/articles/feature-toggles.html
  - id: FlagArgument
    uri: https://martinfowler.com/bliki/FlagArgument.html
  - id: Boolean Blindness
    uri: https://existentialtype.wordpress.com/2011/03/15/boolean-blindness/
  solutions:
  - body: |
      A strategy object encapsulates the options and behaviors controlled by a toggle.
  - body: |
      Explicitly named methods replace boolean flags for specialized behaviors.
- id: Tests prove behavior, not execution
  parent: Without Verification It Is Worthless
  body: |
    Code execution during testing does not verify behavioral correctness. High test coverage without explicit assertions detects few defects. Assertions on observable outcomes turn test suites into executable specifications.
  references:
  - id: AssertionFreeTesting
    uri: https://martinfowler.com/bliki/AssertionFreeTesting.html
  - id: State of Mutation Testing at Google
    uri: https://research.google.com/pubs/archive/46584.pdf
  solutions:
  - body: |
      Mutation testing verifies that tests fail when mutants inject faults into production code.
  - body: |
      Complex test setup indicates poor module decomposition and prompts refactoring into smaller domain models.
  - body: |
      Projects incorporate automated verification tools available within the ecosystem.
- id: Make the wrong thing fail
  parent: Shift Left
  body: |
    The automated build enforces compiler checks, linters, and quality thresholds. Defects halt the build pipeline immediately. Relaxed validation gates degrade system standards.
  references:
  - id: Continuous Integration
    uri: https://martinfowler.com/articles/continuousIntegration.html
  solutions:
  - body: |
      Local environments and continuous integration pipelines execute identical build checks.
  - body: |
      Analysis tools produce unmodified reports for evaluation against quality thresholds in subsequent steps.
  - body: |
      Engineers resolve static analysis warnings at root causes without applying suppressing workarounds.
  - body: |
      Build configurations activate the strictest compiler checks and static analysis presets.
- id: The practitioner decides the outcome
  parent: Competence Applied Is Leverage
  body: |
    Automated tools multiply practitioner competence rather than replacing domain judgement. Automation resolves routine tasks while elevating the impact of human evaluation. Tools address accidental complexity, while definition of standards and verification of correctness remain practitioner responsibilities.
  references:
  - id: Ironies of Automation
    uri: https://doi.org/10.1016/0005-1098(83)90046-8
  - id: Generative AI at Work
    uri: https://www.nber.org/papers/w31161
  - id: METR Early-2025 Study
    uri: https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/
  - id: No Silver Bullet - Essence and Accidents of Software Engineering
    uri: https://worrydream.com/refs/Brooks_1986_-_No_Silver_Bullet.pdf
  solutions:
  - body: |
      Governance documents define explicit standards before tools apply automated assistance.
  - body: |
      Teams maintain authoritative control over rules, prompts, and evaluation pipelines rather than relying on vendor defaults.
  - body: |
      Automated verification pipelines validate generated artifacts through identical testing criteria applied to human contributions.
- id: Environment parity
  parent: Without Verification It Is Worthless
  body: |
    Differences between development and production environments conceal defects until deployment. Declarative code provisions identical development, testing, and production environments. Standardized entrypoint scripts automate build and test execution without manual intervention.
  references:
  - id: The Twelve-Factor App, X. Dev/prod parity
    uri: https://12factor.net/dev-prod-parity
  - id: Scripts to Rule Them All
    uri: https://github.blog/engineering/scripts-to-rule-them-all/
  solutions:
  - body: |
      Infrastructure-as-code definitions provision all local, staging, and production environments.
  - body: |
      Integration tests and local environments execute production artifacts directly.
- id: Telemetry over guesswork
  parent: Shift Left
  body: |
    Telemetry instrumentation deploys concurrently with application features. Four golden signals monitor latency, traffic, errors, and saturation. Telemetry alerts detect user-facing symptoms before customer reports occur.
  references:
  - id: Monitoring Distributed Systems
    uri: https://sre.google/sre-book/monitoring-distributed-systems/
  solutions:
  - body: |
      Each service implements instrumentation for latency, traffic, errors, and saturation before initial deployment.
  - body: |
      Paging alerts trigger on user-impacting symptoms while underlying cause metrics support diagnostic investigation.
- id: What wins when values collide
  parent: Quality Uncompromised
  body: |
    Every software quality axis takes precedence over competing goods during architectural conflict. Auxiliary feature richness and raw throughput never compensate for deficits in core quality axes.
  solutions:
  - body: |
      Code review comments cite the specific software quality axis under evaluation.
  - body: |
      Teams establish ergonomic paths before introducing guardrails that direct developers toward compliant workflows.
- id: Agree at the boundary
  parent: Shift Left
  body: |
    A single independent contract defines boundary data structures. Boundary implementations derive directly from the shared contract specification. Automated verification validates boundary implementations against the contract.
  references:
  - id: Design by Contract
    uri: https://www.eiffel.org/doc/eiffel/ET-_Design_by_Contract_%28tm%29,_Assertions_and_Exceptions
  - id: OpenAPI Design-First Guidance
    uri: https://learn.openapis.org/best-practices.html
  - id: Protocol Buffers
    uri: https://protobuf.dev/overview/
  solutions:
  - body: |
      Code generation tools generate client and server boundary interfaces directly from the contract.
  - body: |
      The build pipeline verifies code conformance against the boundary contract specification.
  - body: |
      Repositories publish versioned contracts independently from concrete client and server implementations.
- id: Clarity over cleverness
  parent: Code Is Written for People
  body: |
    Engineers read code far more often than engineers write code. Consistent conventions and predictable structures reduce comprehension overhead for new readers. Concise modular units keep code within human working memory.
  references:
  - id: Xia et al., IEEE TSE 2018
    uri: https://doi.org/10.1109/TSE.2017.2734091
  - id: PEP 8
    uri: https://peps.python.org/pep-0008/#a-foolish-consistency-is-the-hobgoblin-of-little-minds
    quote: "code is read much more often than it is written"
  - id: The Rails Doctrine
    uri: https://rubyonrails.org/doctrine#convention-over-configuration
  - id: The Elements of Programming Style
    uri: https://en.wikipedia.org/wiki/The_Elements_of_Programming_Style
  - id: Google Engineering Practices
    uri: https://google.github.io/eng-practices/review/reviewer/looking-for.html
  solutions:
  - body: |
      Each file, type, and function remains small enough for comprehension in a single reading.
  - body: |
      Code review comments cite established style guide sections or existing structural conventions.
- id: Premature optimization and Jackson's rules
  parent: Code Is Written for People
  body: |
    Programs explain computational intent to human readers prior to machine execution. Clear modular architecture is the prerequisite for performance profiling and bottleneck isolation. Optimization occurs only after empirical measurement identifies a concrete bottleneck.
  references:
  - id: Literate Programming
    uri: http://www.literateprogramming.com/knuthweb.pdf
    quote: "concentrate rather on explaining to human beings what we want a computer to do"
  - id: SICP, preface
    uri: https://mitp-content-server.mit.edu/books/content/sectbyfn/books_pres_0/6515/sicp.zip/full-text/book/book-Z-H-7.html
    quote: "programs must be written for people to read, and only incidentally for machines to execute"
  - id: Computing Surveys 1974
    uri: https://www.gwern.net/doc/cs/algorithm/1974-knuth.pdf
    quote: "premature optimization is the root of all evil"
  - id: Principles of Program Design
    uri: https://en.wikipedia.org/wiki/Program_optimization#When_to_optimize
    quote: "Rule 1: Don't do it. Rule 2 (for experts only): Don't do it yet."
  solutions:
  - body: |
      Empirical profiling measures execution before developers apply performance optimizations.
- id: Amdahl's Law and the I/O-bound reality
  parent: Simplicity
  body: |
    System speedup is bounded by the proportion of execution time in the improved component. Enterprise software latency is dominated by input and output operations rather than in-memory computations. Meaningful performance improvements eliminate redundant network calls and batch external requests.
  references:
  - id: AFIPS 1967
    uri: https://en.wikipedia.org/wiki/Amdahl%27s_law
  solutions:
  - body: |
      Network requests execute in batches to minimize round trips.
