values:
- id: Speed Through Discipline
  body: |
    Disciplined engineering and rigorous automation produce sustainable speed without technical debt.
- id: Excellence Through Transparency
  body: |
    Transparent collaboration and early disclosure of defects maximize collective competence.
- id: Outcome Over Output
  body: |
    Meaningful customer impact takes precedence over procedural task completion.
- id: Joy Through Craft
  body: |
    Mastery of software craft and continuous automation of repetitive work generate professional fulfillment.
