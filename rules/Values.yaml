values:
- id: Speed Through Discipline
  body: |
    Disciplined engineering and rigorous [[Automation]] produce sustainable speed without technical debt; [[Outcome Over Output]] defines [[Performance]].
- id: Excellence Through Transparency
  body: |
    Transparent collaboration and early disclosure of defects in our code, [[Framework]], and [[Quality]] system maximize collective competence.
- id: Outcome Over Output
  body: |
    Delivering meaningful impact for [[Users]] takes precedence over checking off procedural tasks.
- id: Joy Through Craft
  body: |
    Mastering our craft, building [[Great software]] with [[Purpose]], and conquering repetition through [[Automation]] make the work deeply rewarding.
