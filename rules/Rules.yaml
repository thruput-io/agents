rules:
- id: Stated purpose
  group: Purpose
  parent: You aren't gonna need it
  body: |
    Every Change states its Purpose.
  smells:
  - A pull request description omits its business Purpose.
- id: Every part solves the Purpose
  group: Purpose
  parent: Do One Thing
  body: |
    Every part of a Change traces to the part of the stated Purpose that it solves.
  smells:
  - A Change solves more than its stated Purpose.
- id: Predictable user-facing behavior
  group: Purpose
  parent: Principle of Least Astonishment
  body: |
    Every user-facing operation behaves as its name and domain conventions indicate without hidden side effects.
  smells:
  - A read operation or query method mutates state.
  - An error output hides the failure cause or recovery procedure.
- id: No speculative portability
  group: Purpose
  parent: You aren't gonna need it
  body: |
    No Change adds a compatibility branch for an environment where the task does not run.
- id: Keep pull requests small
  group: Purpose
  parent: Make it work, make it right, make it fast
  body: |
    Every pull request remains small enough to merge quickly without divergence from the main branch.
  smells:
  - A pull request exceeds 400 lines.
- id: Make it work first
  group: Purpose
  parent: Make it work, make it right, make it fast
  body: |
    Every Change delivers working behavior for its stated Purpose before structural refactoring or performance optimization.
  smells:
  - A Change uses a feature toggle instead of a small working slice.
  - A Component prepares for future extensions outside an approved plan.
  - An unmerged pull request exceeds three days of age.
- id: No platform feature where reuse serves
  group: Reuse
  parent: Choose boring technology
  body: |
    No Change implements a platform feature when codebase reuse satisfies the need.
- id: No dependency where the platform serves
  group: Reuse
  parent: Choose boring technology
  body: |
    No Change adds an external dependency when the platform or framework satisfies the need.
- id: No external service where a dependency serves
  group: Reuse
  parent: Choose boring technology
  body: |
    No Change integrates an external service when an external dependency satisfies the need.
- id: No new code where an external tool serves
  group: Reuse
  parent: Choose boring technology
  body: |
    No Change writes new code when an external tool or service satisfies the need.
- id: Available
  group: Reuse
  parent: Choose boring technology
  body: |
    No adopted code requires fees, restrictive licenses, or additional platforms that increase maintenance burden.
- id: Maintained
  group: Reuse
  parent: Choose boring technology
  body: |
    Every adopted library or framework is stable, documented, and actively maintained by multiple contributors.
- id: No second representation
  group: Reuse
  parent: Don't Repeat Yourself
  body: |
    No Change introduces a second representation of knowledge that the codebase already contains.
  smells:
  - A duplicate representation requires manual synchronization with its source.
- id: Consistent with the codebase
  group: Conventions
  parent: Convention over Invention
  body: |
    Every implementation follows surrounding code when no demonstrable standard applies.
  smells:
  - Surrounding code contains a competing implementation pattern.
- id: Demonstrable, not recalled
  group: Conventions
  parent: Convention over Invention
  body: |
    Every invoked standard cites a demonstrable standard.
- id: Readable at a glance
  group: Conventions
  parent: Less is more
  body: |
    Every component and function stays within readability bounds with vertical spacing separating logical blocks.
  smells:
  - A line in a component exceeds 120 characters.
  - A function or public method exceeds 30 lines.
  - Branching logic or block nesting exceeds two levels.
  - Cognitive complexity of a function exceeds 10.
  - A dense representation contains no blank lines between logical blocks.
- id: On point prose
  group: Conventions
  parent: Less is more
  body: |
    Every prose representation stays on point and adheres to single source of truth.
  smells:
  - A prose representation repeats definitions from code or contracts.
  - An unmotivated prose representation includes inline code snippets.
  - An unmotivated prose representation references exact file names or paths.
  - A representation restates the same point across sections.
  - A prose representation walks through logic or schemas established in code.
  - A prose representation contains filler phrasing that conveys no meaning.
- id: ADRs state direction only
  group: Conventions
  parent: Less is more
  references:
  - id: adr.schema.json
    uri: https://thruput.se/agents/schemas/repository/adr.schema.json
  body: |
    Every Architectural Direction record follows adr.schema.json and adheres to on point prose.
  smells:
  - An Architectural Direction record resides outside docs/adrs or contains disallowed sections.
  - An Architectural Direction record describes current codebase inventory or step-by-step walkthroughs.
  - An Architectural Direction record embeds code snippets or rollout phases instead of the decision.
- id: Validating factory
  group: Types
  parent: Parse, don't validate
  body: |
    Every instance originates from a named factory that establishes every invariant before return.
- id: Private constructor
  group: Types
  parent: Parse, don't validate
  body: |
    Every constructor remains private or unexported from its module.
- id: Creation failure in the signature
  group: Types
  parent: Parse, don't validate
  body: |
    Every factory expresses input validation failure in its return signature without throwing an exception.
- id: Sum types
  group: Types
  parent: Make illegal states unrepresentable
  body: |
    Every legal alternative enumerates as a closed sum type rather than a product type of optional fields.
- id: Closed enumerations
  group: Types
  parent: Make illegal states unrepresentable
  body: |
    Every domain state models as a closed enumeration of encapsulated types with belonging domain methods and valid transitions.
  smells:
  - A boolean, free-form string, or pure enum represents a domain state.
  - Branching occurs outside a perimeter fold.
- id: Compile-time optionality
  group: Types
  parent: Make illegal states unrepresentable
  body: |
    Every absent value represents an explicit case that the compiler forces callers to handle.
  smells:
  - Code performs a runtime check for absence.
- id: Wrap primitives
  group: Types
  parent: No Primitive Obsession
  body: |
    Every primitive wraps in a domain primitive before crossing any owned interface.
  smells:
  - A domain signature contains a primitive.
- id: Opaque encapsulated types
  group: Types
  parent: No Primitive Obsession
  body: |
    Every encapsulated type remains opaque, avoids primitive collapse, converts through verified conversions, and folds into foreign shapes only at outbound perimeters.
  smells:
  - Code unwraps domain objects into primitives outside a perimeter.
- id: Exhaustive matching
  group: Domain Model
  parent: Make illegal states unrepresentable
  body: |
    Every pattern match covers the closed case set without wildcard patterns.
- id: Self-guarding aggregates
  group: Domain Model
  parent: Make illegal states unrepresentable
  body: |
    Every state transition of an aggregate executes through a domain method that preserves invariants.
- id: No mutators
  group: Domain Model
  parent: Immutable by default
  body: |
    No domain object exposes mutators or mutates in place, and every update returns a new validated instance.
  smells:
  - An aggregate exposes a setter or raw collection.
- id: Strong typing
  group: Domain Model
  parent: Make illegal states unrepresentable
  body: |
    No domain concept uses a loose type representation.
- id: Domain-only interfaces
  group: Domain Model
  parent: Make illegal states unrepresentable
  body: |
    Every domain object interface accepts and returns domain objects, excluding perimeter validating factories.
  smells:
  - An interface outside a perimeter contains a primitive.
- id: Domain operations
  group: Domain Model
  parent: Make illegal states unrepresentable
  body: |
    Every domain computation and comparison executes through domain methods.
- id: Branching belongs at the perimeter
  group: Domain Model
  parent: Replace conditional with polymorphism
  body: |
    Every polymorphic variant uses a factory, feature, strategy, or builder instead of booleans or pure enums.
  smells:
  - Branching occurs outside a perimeter fold.
- id: Tell, don't ask
  group: Domain Model
  parent: Replace conditional with polymorphism
  body: |
    No caller queries domain object state to direct external actions instead of invoking a domain method.
- id: Respect layering
  group: Domain Model
  parent: Separation of Concerns
  body: |
    No layer imports from higher layers or bypasses adjacent layers against declared dependency direction.
- id: Domain separated from transport and framework
  group: Domain Model
  parent: Separation of Concerns
  body: |
    Every domain module isolates domain objects from transport foreign shapes and frameworks without technical leakages.
  smells:
  - A domain module contains transport foreign shapes or framework code.
  - A domain module depends on external modules, frameworks, or foreign shapes.
  - A domain interface exposes technical transport concerns.
- id: Single-purpose components
  group: Domain Model
  parent: Separation of Concerns
  body: |
    Every component serves a single cohesive purpose within size constraints.
  smells:
  - A component exceeds 200 lines.
  - A function or public method exceeds three parameters.
  - An interface exceeds four public methods.
- id: No primitive leakage
  group: Domain Model
  parent: No Primitive Obsession
  body: |
    No raw primitive crosses a layer boundary.
- id: Delete unused
  group: Dead Code
  parent: You aren't gonna need it
  body: |
    Every unused or obsolete test, production function, and helper is deleted.
- id: No comments in code
  group: Conventions
  parent: No Comments
  body: |
    No version-controlled artifact contains code comments, excluding machine-read comments.
- id: No silent catch
  group: Failure Handling
  parent: Fail fast
  body: |
    No catch block suppresses exceptions without rethrowing.
- id: No default on failure
  group: Failure Handling
  parent: Fail fast
  body: |
    No operation returns or substitutes a default value upon failure.
- id: No strategy fallback
  group: Failure Handling
  parent: Fail fast
  body: |
    No execution path engages a fallback strategy when an initial operation fails.
- id: No suppressed exit status
  group: Failure Handling
  parent: Fail fast
  body: |
    No process ignores a non-zero exit status or error return to mask failure as success.
- id: No discarded diagnostics
  group: Failure Handling
  parent: Fail fast
  body: |
    No command discards error output or masks diagnostic failures behind external state probes.
- id: Scripts abort on error
  group: Failure Handling
  parent: Fail fast
  body: |
    Every script executes in abort-on-error mode and terminates immediately upon any step failure.
- id: No degraded continuation
  group: Failure Handling
  parent: Fail fast
  body: |
    No process continues with partial or stale data when an upstream operation fails with an error or exception.
- id: Linear deterministic code
  group: Failure Handling
  parent: Fail fast
  body: |
    No test, build, or configuration code contains branching logic, fallback defaults, conditional statements, or switch expressions.
- id: No muted tests
  group: Tests
  parent: Test-Driven Development
  body: |
    No test suite contains muted tests or skipped test cases.
- id: Assert values
  group: Tests
  parent: Never trust a test you haven't seen fail
  body: |
    Every test verifies the subject under test with assertions on actual output values to achieve true test coverage.
  smells:
  - A test discards return values to inflate code coverage.
  - An assertion checks only absence of errors without verifying output.
  - An assertion checks only presence or type without verifying exact value.
- id: Add tests for new code
  group: Tests
  parent: Test-Driven Development
  body: |
    Every new production code unit includes corresponding tests.
- id: Add tests for updated code
  group: Tests
  parent: Test-Driven Development
  body: |
    Every updated production code unit includes corresponding updated tests.
- id: Troubleshooting unit test
  group: Tests
  parent: Never fix a bug without a test pinning it
  body: |
    Every bug fix includes a unit test that pins the defect before resolution.
- id: No retry on failure
  group: Tests
  parent: F.I.R.S.T.
  body: |
    No test configuration retries a failed test via retry counts, annotations, or flaky test markers.
- id: One subject under test
  group: Tests
  parent: No gray tests
  body: |
    Every unit test or narrow integration test isolates exactly one subject under test without testing composite object graphs.
- id: No test case coupling
  group: Tests
  parent: F.I.R.S.T.
  body: |
    Every test case executes independently in any order without coupling to other test cases.
- id: Integration Tests Are Black-Box
  group: Tests
  parent: No gray tests
  body: |
    Every integration test validates runtime artifacts through public interfaces via black-box testing.
- id: Test setup leaves production code alone
  group: Toolchain & Environment
  parent: Production Parity
  body: |
    No test setup alters the behavior of production code.
- id: No global quality changes
  group: Toolchain & Environment
  parent: The Toolchain Is the Guardrail
  body: |
    No Change modifies global quality standards except within a dedicated pull request containing only that change.
  smells:
  - A pull request modifies global lint rules alongside other changes.
- id: No local disabling of lint rules
  group: Toolchain & Environment
  parent: The Toolchain Is the Guardrail
  body: |
    No file disables a lint rule locally through comments or pragmas, and all exemptions configure globally.
- id: No check the type system makes
  group: Test Pyramid
  parent: Push tests down the pyramid
  body: |
    No test or runtime check validates conditions that the type system rejects at compile time.
- id: No test a linter makes
  group: Test Pyramid
  parent: Push tests down the pyramid
  body: |
    No test suite validates conditions that static code analysis rejects.
- id: No narrow integration test for a unit
  group: Test Pyramid
  parent: Push tests down the pyramid
  body: |
    No narrow integration test validates behavior that a unit test covers.
- id: No integration test for one component
  group: Test Pyramid
  parent: Push tests down the pyramid
  body: |
    No integration test validates component behavior that a narrow integration test covers.
- id: No end-to-end test for one service
  group: Test Pyramid
  parent: Push tests down the pyramid
  body: |
    No end-to-end test validates service behavior that an integration test covers.
- id: No manual test for an automated one
  group: Test Pyramid
  parent: Push tests down the pyramid
  body: |
    No manual test validates behavior that an automated test suite covers.
- id: No committing generated code
  group: Toolchain & Environment
  parent: The Toolchain Is the Guardrail
  body: |
    No commit includes generated code artifacts.
- id: Strict presets
  group: Toolchain & Environment
  parent: The Toolchain Is the Guardrail
  body: |
    Every toolchain configuration applies the strictest presets for linting and formatting.
- id: No optionality
  group: Contracts
  parent: Avoid optionality
  body: |
    No contract or function signature uses optional variables or optional parameters unless external code forces them.
- id: Prefer APIs without optionality
  group: Contracts
  parent: Avoid optionality
  body: |
    Every integration chooses external APIs without optional parameters over alternatives with optional parameters.
- id: Overload per option combination
  group: Contracts
  parent: Avoid optionality
  body: |
    Every interface provides explicit overloads or named methods for parameter combinations instead of optional parameters.
- id: Forced optionality at perimeter
  group: Contracts
  parent: Fold at Perimeter
  body: |
    Every invocation of external optionality resolves in the immediate invoking statement at the perimeter.
- id: Accept unknown properties
  group: Contracts
  parent: Prepare reader for evolving producer
  body: |
    Every consumer accepts foreign shapes with unrecognized properties and ignores unknown fields.
- id: Generic parameters, specific returns
  group: Contracts
  parent: Prepare reader for evolving producer
  body: |
    Every public method declares the most generic parameter types and the most specific return type.
- id: Shapes live in the contract
  group: Contracts
  parent: Contract First
  body: |
    Every boundary shape defines in an authoritative contract that generates representations for both sides.
  smells:
  - A boundary shape exists in code without an authoritative contract.
  - A boundary shape change leaves the contract unchanged.
- id: No unstated standard
  group: Conventions
  parent: Adoption is articulation
  body: |
    No instruction directs an agent to follow an unrecorded standard absent from governing documents.
- id: One-command setup
  group: Toolchain & Environment
  parent: Infrastructure as Code
  body: |
    A single documented command executes clone, build, and test operations for the complete environment.
- id: No manual environment setup
  group: Toolchain & Environment
  parent: Infrastructure as Code
  body: |
    No environment setup requires manual steps for test or production environments.
- id: Twice is automated
  group: Toolchain & Environment
  parent: Infrastructure as Code
  body: |
    Every procedure executed a second time is automated by script.
  smells:
  - A manual procedure is documented for repetition without automation scripts.
- id: Ship with telemetry
  group: Toolchain & Environment
  parent: Own the Runtime
  body: |
    Every Change that adds runtime behavior includes corresponding telemetry signals.
- id: No iteration over calls over the network
  group: Performance
  parent: Iterations over calls over the network is bad design
  body: |
    No loop or iteration executes calls over the network.
- id: No performance motivations on in-memory operations
  group: Performance
  parent: Make it work, make it right, make it fast
  body: |
    No Change optimizes in-memory operations unless evidence demonstrates a bottleneck or reduces network calls.
