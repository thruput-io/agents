rules:
- id: Stated purpose
  marker: MUST
  group: Purpose
  parent: You aren't gonna need it
  body: |
    State the [[Purpose]] of every [[Change]].
- id: No code without purpose
  marker: MUST NOT
  group: Purpose
  parent: You aren't gonna need it
  body: |
    Write or merge code whose [[Purpose]] is not stated.
- id: Every part solves the Purpose
  marker: MUST
  group: Purpose
  parent: Code as a Subset of the Purpose
  body: |
    Trace every part of the [[Change]] to the part of the stated [[Purpose]] it solves.
- id: Nothing beyond the Purpose
  marker: MUST NOT
  group: Purpose
  parent: Code as a Subset of the Purpose
  body: |
    Solve more than the stated [[Purpose]].
- id: No speculative portability
  marker: MUST NOT
  group: Purpose
  parent: You aren't gonna need it
  body: |
    Add platform, shell, or environment [[Compatibility branch]]es for [[Environment]]s the task does not run in.
- id: Keep pull requests small
  marker: MUST
  group: Purpose
  parent: Make it work, make it right, make it fast
  body: |
    Keep every [[Pull request]] small enough to merge quickly without diverging from the main branch.
  smells:
  - A [[Pull request]] larger than 400 lines.
- id: Make it work first
  marker: MUST
  group: Purpose
  parent: Make it work, make it right, make it fast
  body: |
    Deliver working behaviour for the stated [[Purpose]] before refactoring structure or optimising [[Performance]].
  smells:
  - Using [[Feature toggle]]s instead of shipping a small working slice.
  - Preparations for future extensions of a [[Component]] not already laid out in a well-researched plan.
  - A [[Pull request]] more than 3 days old that is still not merged.
- id: No platform feature where reuse serves
  marker: MUST NOT
  group: Reuse
  parent: Choose boring technology
  body: |
    Meet a need with the [[Platform or framework]] when [[Codebase reuse]] meets it.
- id: No dependency where the platform serves
  marker: MUST NOT
  group: Reuse
  parent: Choose boring technology
  body: |
    Add an [[External dependency]] when the [[Platform or framework]] meets the need.
- id: No external service where a dependency serves
  marker: MUST NOT
  group: Reuse
  parent: Choose boring technology
  body: |
    Integrate an [[External tool or service]] when an [[External dependency]] meets the need.
- id: No new code where an external tool serves
  marker: MUST NOT
  group: Reuse
  parent: Choose boring technology
  body: |
    Write [[New code]] when an [[External tool or service]] meets the need.
- id: Available
  marker: MUST NOT
  group: Reuse
  parent: Choose boring technology
  body: |
    Adopt existing code that requires payments or license models, or an extra [[Platform or framework]], that would increase the maintenance burden.
- id: Maintained
  marker: MUST
  group: Reuse
  parent: Choose boring technology
  body: |
    Adopt existing code only where it is a [[Maintained library or framework]] that is stable, documented, and maintained by several active contributors.
- id: No second representation
  marker: MUST NOT
  group: Reuse
  parent: Don't Repeat Yourself
  body: |
    Add a second [[Representation]] of knowledge the codebase already holds.
  smells:
  - A copy of a [[Representation]] that must be kept in step with its original.
- id: Consistent with the codebase
  marker: MUST
  group: Conventions
  parent: Convention Over Novelty
  body: |
    Follow the [[Surrounding code]] where no [[Demonstrable standard]] decides the question.
  smells:
  - A second way of doing the same thing in the [[Surrounding code]].
- id: Demonstrable, not recalled
  marker: MUST
  group: Conventions
  parent: Convention Over Novelty
  body: |
    Point at a [[Demonstrable standard]] whenever you invoke a standard as justification. Novel work is not required to cite a standard it does not have.
- id: Single-purpose components
  marker: MUST
  group: Conventions
  parent: Less is more
  body: |
    Decompose [[Production code]] into small, single-purpose [[Component]]s.
  smells:
  - A [[Production code]] [[Component]] longer than 200 lines.
  - A [[Function]] or [[Public method]] with more than 3 parameters.
  - An [[Interface]] with more than 4 [[Public method]]s, not counting [[Overload]]s or convenience methods.
- id: Validating factory
  marker: MUST
  group: Types
  parent: Parse, don't validate
  body: |
    Provide [[Instance]]s only through a named [[Factory]] that establishes every [[Invariant]] before returning.
- id: Private constructor
  marker: MUST
  group: Types
  parent: Parse, don't validate
  body: |
    Keep the [[Constructor]] private, or unexported from its [[Module]].
- id: Creation failure in the signature
  marker: MUST
  group: Types
  parent: Parse, don't validate
  body: |
    Return the invalid-input case from a [[Factory]] in its type [[Signature]] rather than throw an [[Exception]].
- id: Sum types
  marker: MUST
  group: Types
  parent: Make illegal states unrepresentable
  body: |
    Enumerate the legal alternatives as a closed [[Sum type]] rather than a [[Product type]] of optional fields.
- id: Closed enumerations
  marker: MUST
  group: Types
  parent: Make illegal states unrepresentable
  body: |
    Model every legal domain state as a closed enumeration of [[Encapsulated type]]s with belonging [[Domain method]]s and possible transitions.
  smells:
  - A boolean, free-form string, or [[Pure enum]] representing a domain state.
  - "[[Branching]] outside of a [[Perimeter]] fold."
- id: Compile-time optionality
  marker: MUST
  group: Types
  parent: Make illegal states unrepresentable
  body: |
    Make absence an explicit case the [[Compiler]] forces every caller to handle.
  smells:
  - A [[Runtime check]] for absence.
- id: Wrap primitives
  marker: MUST
  group: Types
  parent: No Primitive Obsession
  body: |
    Wrap a [[Raw value]] in its [[Domain primitive]] before it crosses any [[Interface]] of ours.
  smells:
  - A [[Raw value]] in a domain [[Signature]].
- id: Exhaustive matching
  marker: MUST
  group: Domain Model
  parent: Make illegal states unrepresentable
  body: |
    Use [[Pattern matching]] over the closed set of cases, with no [[Wildcard pattern]].
- id: Self-guarding aggregates
  marker: MUST
  group: Domain Model
  parent: Make illegal states unrepresentable
  body: |
    Route every state change of an [[Aggregate]] through a [[Domain method]] that re-establishes its [[Invariant]]s.
- id: No mutators
  marker: MUST NOT
  group: Domain Model
  parent: Immutable by default
  body: |
    Expose a [[Setter]] or any operation that changes a [[Domain object]] in place. A change returns a new [[Instance]] that passes the [[Validating path of creation]] again.
  smells:
  - An exposed [[Setter]] or [[Raw collection]] on an [[Aggregate]].
- id: No unwrapping
  marker: MUST NOT
  group: Domain Model
  parent: Make illegal states unrepresentable
  body: |
    Unwrap [[Domain objects]] into [[Primitive]]s anywhere but at the [[Perimeter]].
- id: Strong typing
  marker: MUST NOT
  group: Domain Model
  parent: Make illegal states unrepresentable
  body: |
    Represent a domain concept with a [[Loose type]].
- id: Domain-only interfaces
  marker: MUST
  group: Domain Model
  parent: Make illegal states unrepresentable
  body: |
    Access a [[Domain object]] only through methods that accept and return [[Domain object]]s, the [[Validating factory]] at the [[Perimeter]] excepted.
  smells:
  - An [[Anonymous data type]] or [[Primitive]] in the [[Interface]] of a [[Component]] outside of a [[Perimeter]].
- id: Domain operations
  marker: MUST
  group: Domain Model
  parent: Make illegal states unrepresentable
  body: |
    Perform comparison, addition, subtraction, or any other domain operation via [[Domain method]]s.
- id: Branching belongs at the perimeter
  marker: MUST
  group: Domain Model
  parent: Replace conditional with polymorphism
  body: |
    Use a [[Factory]] with [[Inheritance]], a [[Feature]], a [[Strategy]], or a [[Builder]] instead of a boolean or [[Pure enum]].
  smells:
  - "[[Branching]] outside of a [[Perimeter]] fold."
- id: Tell, don't ask
  marker: MUST NOT
  group: Domain Model
  parent: Replace conditional with polymorphism
  body: |
    Query a [[Domain object]]'s state to decide how to act upon it instead of invoking a [[Domain method]] on it.
- id: Respect layering
  marker: MUST NOT
  group: Domain Model
  parent: Separation of Concerns
  body: |
    Import or call against the [[Dependency direction]] the architecture declares: from a [[Layer]] into the layer above it, or skipping a layer.
- id: Domain separated from transport and framework
  marker: MUST
  group: Domain Model
  parent: Separation of Concerns
  body: |
    Isolate [[Domain object]] representations in their own [[Module]] separated from transport [[Foreign shape]]s and [[Framework]] code, with no dependencies on other [[Module]]s in the project, using [[Interface]] abstractions that hide concerns of technical character.
  smells:
  - "[[Domain object]]s placed in the same [[Module]] as transport [[Foreign shape]]s or [[Framework]] code."
  - A [[Domain object]] or domain [[Module]] that references or depends on other [[Module]]s in the project, a [[Framework]], or transport [[Foreign shape]]s.
  - An [[Interface]] in the domain [[Layer]] that exposes technical concerns rather than hiding them behind domain concepts.
- id: No primitive leakage
  marker: MUST
  group: Domain Model
  parent: No Primitive Obsession
  body: |
    Keep raw [[Primitive]]s from crossing a [[Layer]] boundary.
- id: Delete unused
  marker: MUST
  group: Dead Code
  parent: You aren't gonna need it
  body: |
    Delete [[Test]]s, [[Production code]], and [[Helper code]] that are no longer relevant or used.
- id: No comments in code
  marker: MUST NOT
  group: Conventions
  parent: No Comments
  body: |
    Comment any version-controlled artifact. Only a [[Machine-read comment]] is exempt.
- id: No silent catch
  marker: MUST NOT
  group: Failure Handling
  parent: Fail fast
  body: |
    Use [[Try/catch block]]s that do not [[Rethrow]] (silencing failures).
- id: No default on failure
  marker: MUST NOT
  group: Failure Handling
  parent: Fail fast
  body: |
    Return or use a [[Default value]] when failing.
- id: No strategy fallback
  marker: MUST NOT
  group: Failure Handling
  parent: Fail fast
  body: |
    Make code 'hardened' with a [[Fallback strategy]] tried when the first one fails.
- id: No suppressed exit status
  marker: MUST NOT
  group: Failure Handling
  parent: Fail fast
  body: |
    Discard or ignore a failed [[Exit status]], error return value, or faulted operation so that a failure passes as success.
- id: No discarded diagnostics
  marker: MUST NOT
  group: Failure Handling
  parent: Fail fast
  body: |
    Send a command's [[Error output]] nowhere, or use another tool to detect state instead of letting the failing tool report its error.
- id: Scripts abort on error
  marker: MUST NOT
  group: Failure Handling
  parent: Fail fast
  body: |
    Let a script continue past a failing step. Every script runs in the language's [[Abort-on-error mode]], and a failing step ends it at once.
- id: No degraded continuation
  marker: MUST NOT
  group: Failure Handling
  parent: Fail fast
  body: |
    Proceed with stale, partial, or assumed input after the step that produces it failed with a failed [[Exit status]] or [[Exception]]; report and stop.
- id: Linear deterministic code
  marker: MUST NOT
  group: Failure Handling
  parent: Fail fast
  body: |
    Write test, build, or configuration code that contains [[Branching logic]] or fallback [[Default value]]s, such as, but not limited to, `if` [[Statement]]s, `switch`/`case` expressions, or defaulted values.
- id: No muted tests
  marker: MUST NOT
  group: Tests
  parent: Test-Driven Development
  body: |
    Leave a [[Muted test]] or skip [[Test]]s.
- id: No coverage-only tests
  marker: MUST NOT
  group: Tests
  parent: Never trust a test you haven't seen fail
  body: |
    Write [[Test]]s that discard return values, or make [[Assertion]]s on generalizations such as the presence or type of the asserted value, just to increase [[Code coverage]].
- id: Assert values
  marker: MUST
  group: Tests
  parent: F.I.R.S.T.
  body: |
    Make an [[Assertion]] on the actual returned values — not merely that no error occurred, or on generalizations such as the presence or type of the asserted value.
- id: Add tests for new code
  marker: MUST
  group: Tests
  parent: Test-Driven Development
  body: |
    Add [[Test]]s for new [[Production code]].
- id: Add tests for updated code
  marker: MUST
  group: Tests
  parent: Test-Driven Development
  body: |
    Add [[Test]]s for updated [[Production code]].
- id: Troubleshooting unit test
  marker: MUST
  group: Tests
  parent: Never fix a bug without a test pinning it
  body: |
    Any bug fix has a [[Unit test]] pinning it.
- id: No retry on failure
  marker: MUST NOT
  group: Tests
  parent: F.I.R.S.T.
  body: |
    Configure a [[Test]] to run again until it passes, by a retry count, a retry annotation, or a [[Flaky test]] marker.
- id: One subject under test
  marker: MUST NOT
  group: Tests
  parent: No grey tests
  body: |
    Include more than one [[Subject under test]] or test the composition of objects within a [[Unit test]] or a [[Narrow integration test]].
- id: No test case coupling
  marker: MUST NOT
  group: Tests
  parent: F.I.R.S.T.
  body: |
    Allow one [[Test case]] to depend on another; every test case is executable on its own, in any order.
- id: Integration Tests Are Black-Box
  marker: MUST
  group: Tests
  parent: No grey tests
  body: |
    Test the shipped [[Runtime artifact]] through its public [[API]]s using [[Black-box testing]].
- id: Test setup leaves production code alone
  marker: MUST NOT
  group: Toolchain & Environment
  parent: Production Parity
  body: |
    Alter the behaviour of [[Production code]] in [[Test setup]].
- id: No global lint changes
  marker: MUST NOT
  group: Toolchain & Environment
  parent: The Toolchain Is the Guardrail
  body: |
    Change global or project-wide [[Lint rule]]s, except in a [[Pull request]] that contains only that [[Change]].
- id: No global quality changes
  marker: MUST NOT
  group: Toolchain & Environment
  parent: The Toolchain Is the Guardrail
  body: |
    Change global or project-wide [[Quality]] standards, except in a [[Pull request]] that contains only that [[Change]].
- id: No local disabling of lint rules
  marker: MUST NOT
  group: Toolchain & Environment
  parent: The Toolchain Is the Guardrail
  body: |
    Disable a [[Lint rule]] locally, by a comment, a [[Pragma]], or alike. An exception the team accepts is expressed globally, by a [[File]] filter in the lint configuration or alike.
- id: No check the type system makes
  marker: MUST NOT
  group: Test Pyramid
  parent: Push tests down the pyramid
  body: |
    Write a [[Runtime check]] or a test for what the [[Type system]] can reject.
- id: No test a linter makes
  marker: MUST NOT
  group: Test Pyramid
  parent: Push tests down the pyramid
  body: |
    Write a test for what [[Static code analysis]] can reject.
- id: No narrow integration test for a unit
  marker: MUST NOT
  group: Test Pyramid
  parent: Push tests down the pyramid
  body: |
    Write a [[Narrow integration test]] for what a [[Unit test]] can catch.
- id: No integration test for one component
  marker: MUST NOT
  group: Test Pyramid
  parent: Push tests down the pyramid
  body: |
    Write an [[Integration test]] for what a [[Narrow integration test]] can catch.
- id: No end-to-end test for one service
  marker: MUST NOT
  group: Test Pyramid
  parent: Push tests down the pyramid
  body: |
    Write an [[End-to-end test]] for what an [[Integration test]] can catch.
- id: No manual test for an automated one
  marker: MUST NOT
  group: Test Pyramid
  parent: Push tests down the pyramid
  body: |
    Leave to a [[Manual test]] what an [[End-to-end test]] can catch.
- id: No committing generated code
  marker: MUST NOT
  group: Toolchain & Environment
  parent: The Toolchain Is the Guardrail
  body: |
    Commit [[Generated code]].
- id: Strict presets
  marker: MUST
  group: Toolchain & Environment
  parent: The Toolchain Is the Guardrail
  body: |
    Use the strictest possible [[Preset]]s on linting and style.
- id: No optionality
  marker: MUST NOT
  group: Contracts
  parent: Avoid optionality
  body: |
    Use optional variables or [[Optional parameter]]s unless [[Code We Cannot Control]] forces them.
- id: Prefer APIs without optionality
  marker: MUST
  group: Contracts
  parent: Avoid optionality
  body: |
    Choose, among [[Code We Cannot Control]] that meets the need, an [[API]] without [[Optional parameter]]s over one with them.
- id: Overload per option combination
  marker: MUST
  group: Contracts
  parent: Avoid optionality
  body: |
    Provide an [[Overload]] or an [[Explicitly named method]] for each allowed combination of options instead of [[Optional parameter]]s.
- id: Forced optionality at perimeter
  marker: MUST
  group: Contracts
  parent: Fold at Perimeter
  body: |
    Handle [[Optionality]] forced by [[Code We Cannot Control]] in the [[Statement]] that invokes it or receives its return.
- id: Accept unknown properties
  marker: MUST
  group: Contracts
  parent: Prepare reader for evolving producer
  body: |
    Accept a [[Foreign shape]] that carries properties you do not know, and ignore them.
- id: Generic parameters, specific returns
  marker: MUST
  group: Contracts
  parent: Prepare reader for evolving producer
  body: |
    Declare the most generic [[Parameter type]]s and the most specific [[Return type]] a [[Public method]] can honour.
- id: Shapes live in the contract
  marker: MUST
  group: Contracts
  parent: Contract First
  body: |
    Define a shape that crosses a boundary in the [[Contract]] and derive the code on both sides from it.
  smells:
  - A shape that crosses a boundary defined only in code without a [[Contract]].
  - A [[Change]] to a boundary shape that leaves the [[Contract]] unchanged.
- id: No unstated standard
  marker: MUST NOT
  group: Conventions
  parent: Adoption is articulation
  body: |
    Instruct an [[AI agent]] to follow a [[Coding standard]] that has no entry in these documents; add the entry and cite it.
- id: One-command setup
  marker: MUST
  group: Toolchain & Environment
  parent: Infrastructure as Code
  body: |
    Keep clone, build, and [[Test]] of the entire [[Environment]] to one documented command.
- id: No manual environment setup
  marker: MUST NOT
  group: Toolchain & Environment
  parent: Infrastructure as Code
  body: |
    Set up a test or production [[Environment]] with a manual step.
- id: Twice is automated
  marker: MUST
  group: Toolchain & Environment
  parent: Infrastructure as Code
  body: |
    Script a procedure for [[Automation]] the second time it is performed.
  smells:
  - A manual procedure written down to be repeated instead of scripted for [[Automation]].
- id: Ship with telemetry
  marker: MUST
  group: Toolchain & Environment
  parent: Own the Runtime
  body: |
    Add the [[Signal]] in the [[Change]] that adds the behaviour it shows.
- id: No iteration over calls over the network
  marker: MUST NOT
  group: Performance
  parent: Iterations over calls over the network is bad design
  body: |
    Iterate over [[Calls over the network]].
- id: No performance motivations on in-memory operations
  marker: MUST NOT
  group: Performance
  parent: Make it work, make it right, make it fast
  body: |
    Motivate any [[Change]] by [[Performance]] on [[In-memory operation]]s; a performance change reduces [[Calls over the network]] or addresses a bottleneck proven by a named measurement as [[Evidence]].
