levels:
- id: Value
  specification: Terminal human intent
  criteria:
  - include: Asking 'Why?' exits this taxonomy and collapses into ethics, biology, or theology. The fractal ends here.
  - include: Speaks of people and what they care about.
  - include: A disposition or attitude we hold.
  - include: A weighing with nothing above it to decide it. A value is what decides the weighings below.
  - include: Answers why we chose the axioms we hold and not others.
  - exclude: Is about software, a system, or a method. Mentioning one in passing does not make it so.
- id: Axiom
  specification: A truth we hold.
  criteria:
  - include: Expresses an irreducible truth. Asking 'Why?' of it has no answer; asking why we hold it rather than another truth leads straight to a value.
  - include: |-
      Held beyond argument: a stone tablet. It cannot be moved down the ladder.
  - include: Its body may state the mechanism that makes it true; stating a mechanism is not weighing.
  - include: Stays true when 'code' is replaced by any other artifact.
  - include: Carries no marker.
  - exclude: Names a software concept.
  - exclude: Follows from another axiom.
  - exclude: Addresses how people should act.
  parent: Value
- id: Rationale
  specification: How an axiom is turned into a principle.
  criteria:
  - include: Requires a [[Document reference]] to explain.
  - include: Weighs two goods against each other, either of which could be chosen, or explains a mechanism. Every 'X over Y' between two goods is a rationale.
  - include: |-
      A weighing is measured against the level above: the parent decides which side wins. A weighing the parent cannot decide points at a defect in the parent.
  - include: The losing side of its trade-off is a candidate code smell.
  - include: Its solutions say how to apply it, opened by SHOULD or MAY. A preference, an 'X over Y' that a reviewer cannot answer with violation or not, is a solution here and never a rule.
  - exclude: Can be stated in two sentences without loss and weighs nothing.
  - exclude: Rejects a smell rather than weighing two goods. 'Do X, not Y' where Y is a smell is a principle or a rule.
  - exclude: Has no level above it to decide the weighing.
  parent: Axiom
- id: Principle
  specification: A memorable statement of how we code and what we code, such as [[Don't Repeat Yourself]] or [[Contract First]].
  criteria:
  - include: Can be expressed in one or two sentences that you can act on or adhere to without having to reason about it, typically 'given this, do that' or 'we do it like this'.
  - include: Its name alone is cited from memory in a review, and the name says what to do.
  - include: States a stance, applied by understanding the idea behind it. Its violation shows in code as a smell a rule can name.
  - include: May enumerate the cases it covers. Enumeration is not reasoning and does not make it a rationale.
  - exclude: A name alone, with no statement behind it.
  - exclude: Weighs one option against another.
  - exclude: Names a technology.
  - exclude: Restates its rationale, or carries an enumeration the glossary already holds.
  parent: Rationale
- id: Rule
  specification: |-
    A MUST or MUST NOT a reviewer answers on a diff: violation or not.
  criteria:
  - include: A [[Developer]] answers 'violation or not?' on a ten-line diff without understanding the whole system.
  - include: Opens with MUST or MUST NOT.
  - include: Names the [[Bad Code]] it forbids.
  - include: Where [[Static code analysis]] can decide it, a standard implements it for each technology.
  - exclude: Names a technology. A statement that names a technology and still holds an instruction without it is split into a rule and a standard.
  - exclude: Needs an idea explained to be applied.
  - exclude: Restates its principle. A rule that only repeats the principle's statement adds no question a reviewer can answer.
  parent: Principle
- id: Standard
  specification: A rule implemented in code for one technology.
  criteria:
  - include: Names a language, [[Framework]], [[Library]], or tool.
  - include: |-
      [[Static code analysis]] evaluates it and rejects a violation deterministically in milliseconds.
  - exclude: Can be evaluated without knowing the technology in use.
  parent: Rule
