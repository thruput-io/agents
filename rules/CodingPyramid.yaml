levels:
- id: Value
  specification: |
    Terminal human intent: a disposition we hold that answers why we chose our [[Axiom]]s and decides the weighings below.
- id: Axiom
  parent: Value
  specification: |
    An irreducible truth we hold beyond argument.
- id: Rationale
  parent: Axiom
  specification: |
    The reasoning that turns an [[Axiom]] into a [[Principle]], backed by a [[Document reference]]; it may weigh competing goods.
- id: Principle
  parent: Rationale
  specification: |
    A memorable one- to three-sentence statement of how we design and write code, such as [[Don't Repeat Yourself]] or [[Contract First]].
- id: Rule
  parent: Principle
  specification: |
    An explicit, technology-independent requirement or prohibition that enforces a [[Principle]].
- id: Standard
  parent: Rule
  specification: |
    A [[Rule]] implemented for a specific technology so [[Static code analysis]] can enforce it deterministically; most live in dedicated linter repositories rather than in this document.
