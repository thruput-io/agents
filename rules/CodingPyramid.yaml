levels:
- id: Value
  specification: |
    Terminal human intent: a disposition we hold that answers why we chose our [[Axiom]]s and decides the weighings below.
- id: Axiom
  parent: Value
  specification: |
    An irreducible truth we hold beyond argument.
- id: Rationale
  parent: Axiom
  specification: |
    The reasoning that turns an [[Axiom]] into a [[Principle]] by weighing competing goods or explaining a mechanism with a [[Document reference]], and whose [[SHOULD]] or [[MAY]] solutions say how to apply it.
- id: Principle
  parent: Rationale
  specification: |
    A memorable one- to three-sentence statement of how we design and write code, such as [[Don't Repeat Yourself]] or [[Contract First]].
- id: Rule
  parent: Principle
  specification: |
    A [[MUST]] requirement stating the [[Defined]] code required, or a [[MUST NOT]] prohibition naming the [[Defined]] [[Bad Code]] forbidden, that a [[Developer]] evaluates on a [[Change]] as a [[Violation]] or non-violation without knowing the technology in use.
- id: Standard
  parent: Rule
  specification: |
    A [[Rule]] implemented for a specific technology so [[Static code analysis]] can evaluate and reject a [[Violation]] deterministically.
