levels:
- id: Value
  specification: |
    Terminal human intent: a cultural disposition that answers why we hold our [[Axiom]]s and decides weighings below it.
- id: Axiom
  parent: Value
  specification: |
    An irreducible foundational premise held beyond argument, answering to a [[Value]].
- id: Rationale
  parent: Axiom
  specification: |
    The explanation of how an [[Axiom]] turns into a [[Principle]], weighing competing goods or explaining a causal mechanism with a [[Document reference]] and optional [[SHOULD]] or [[MAY]] solutions.
- id: Principle
  parent: Rationale
  specification: |
    A well-known, easy-to-remember statement of one to three sentences—such as [[Don't Repeat Yourself]] or [[Contract First]]—stating the stance that guides how we design and write code.
- id: Rule
  parent: Principle
  specification: |
    A [[MUST]] or [[MUST NOT]] requirement in a [[Group]] that a [[Developer]] answers with [[Violation]] or non-violation on a diff; [[Architectural Direction]] overrides a [[Rule]].
- id: Standard
  parent: Rule
  specification: |
    A [[Rule]] implemented in code for a single technology context so [[Static code analysis]] evaluates and rejects a [[Violation]] deterministically.
