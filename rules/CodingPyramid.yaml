levels:
- id: Value
  specification: A Value defines terminal human intent.
- id: Axiom
  specification: An Axiom expresses an irreducible truth held without argument.
  parent: Value
- id: Rationale
  specification: A Rationale weighs competing goods to derive a Principle from an Axiom.
  parent: Axiom
- id: Principle
  specification: A Principle states an actionable stance on how and what we code.
  parent: Rationale
- id: Rule
  specification: A Rule defines a binary requirement that a reviewer evaluates on a diff.
  parent: Principle
- id: Standard
  specification: A Standard implements a Rule for one technology.
  parent: Rule
