standards:
- id: additionalProperties never false
  context: JSON Schema
  parent: Accept unknown properties
  body: |
    `additionalProperties` is never `false`.
- id: unevaluatedProperties never false
  context: JSON Schema
  parent: Accept unknown properties
  body: |
    `unevaluatedProperties` is never `false`.
- id: No || true
  context: Bash
  parent: No suppressed exit status
  body: |
    A command never appends `|| true` or `|| :` to suppress its exit status.
- id: No 2>/dev/null
  context: Bash
  parent: No discarded diagnostics
  body: |
    A command never redirects diagnostics to `2>/dev/null` when its failure matters.
- id: set -euo pipefail
  context: Bash
  parent: Scripts abort on error
  body: |
    Every script declares `set -euo pipefail` as the first statement after its shebang.
- id: No any in domain signatures
  context: TypeScript
  parent: Strong typing
  body: |
    The signature of a domain object or operation never contains `any`, `unknown`, `object`, or `Record<string, unknown>`.
- id: Layer dependencies as an ArchUnit test
  context: ArchUnit
  parent: Respect layering
  body: |
    An ArchUnit test declares permitted layer dependencies and fails the build on any undeclared dependency.
