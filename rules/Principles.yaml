principles:
- id: You aren't gonna need it
  parent: Validated user need over speculative scope
  body: |
    An implementation contains only functionality required by an active, validated need, excluding anticipated future capability.
  references:
  - id: Ron Jeffries
    uri: https://ronjeffries.com/xprog/articles/practices/pracnotneed/
    quote: Always implement things when you actually need them, never when you just foresee that you need them.
- id: Do One Thing
  parent: Validated user need over speculative scope
  body: |
    Each Change is a minimal, self-contained modification that addresses only its one stated Purpose.
  references:
  - id: Google Engineering Practices, Small CLs
    uri: https://google.github.io/eng-practices/review/developer/small-cls.html
- id: Principle of Least Astonishment
  parent: Validated user need over speculative scope
  body: |
    A system behaves in the way Users expect, without hidden side effects or surprising outcomes.
  references:
  - id: Saltzer and Kaashoek
    uri: https://en.wikipedia.org/wiki/Principle_of_least_astonishment
- id: Choose boring technology
  parent: Code is a liability, not an asset
  body: |
    The Development Stack is small, stable, and composed of well-understood technology.
  references:
  - id: Dan McKinley
    uri: https://mcfunley.com/choose-boring-technology
    quote: Every company gets about three innovation tokens.
- id: Convention over Invention
  parent: Clarity over cleverness
  body: |
    Structure follows conventions of the ecosystem and Surrounding code, reserving novelty for the domain solution. Only a Demonstrable standard constitutes a convention.
- id: Push tests down the pyramid
  parent: The Practical Test Pyramid
  body: |
    Each defect is caught at the lowest level of the Test Pyramid capable of detecting it.
- id: No Comments
  parent: Intent lives where it is checked
  body: |
    Every Comment intent resides where it is checked. Only a Machine-read comment remains in the code.
- id: Fail fast
  parent: Crash, don't guess
  body: |
    A system fails immediately on an unexpected state and never continues on a guess. A safeguard that swallows failure exists only where Evidence justifies it.
- id: Fold at Perimeter
  parent: Translate at the door
  body: |
    A Foreign shape folds into an Encapsulated type at the Perimeter and converts back only there. Internal code never observes a Foreign shape.
- id: Make illegal states unrepresentable
  parent: Encapsulation
  body: |
    The Type system models every business rule, transition, and entity as a dedicated type rather than an untyped data structure, eliminating invalid runtime states.
- id: Parse, don't validate
  parent: Translate at the door
  body: |
    The Perimeter parses raw input once through the Validating path of creation into an Encapsulated type, never passing unparsed primitives inward.
- id: Immutable by default
  parent: Encapsulation
  body: |
    Every Domain object is Immutable upon creation.
- id: No Primitive Obsession
  parent: Encapsulation
  body: |
    Every method signature inward of the Perimeter uses a dedicated domain type instead of a raw primitive.
- id: Avoid optionality
  parent: Optionality Drives Complexity
  body: |
    Each allowed combination of options is a dedicated operation with a distinct name. Optionality is never an operation parameter.
- id: Test-Driven Development
  parent: Tests prove behavior, not execution
  body: |
    A failing test exists before production code is written to satisfy it.
- id: Never fix a bug without a test pinning it
  parent: Tests prove behavior, not execution
  body: |
    A bug is pinned by a Failing test before it is fixed, and the fix is complete when that test passes.
- id: No gray tests
  parent: Tests prove behavior, not execution
  body: |
    Every test is either a black-box test of the shipped artifact or a test of a single subject in isolation.
- id: Never trust a test you haven't seen fail
  parent: Tests prove behavior, not execution
  body: |
    A test is valid only after it is observed failing for the specific behavior it checks.
- id: F.I.R.S.T.
  parent: Tests prove behavior, not execution
  body: |
    Every test is Fast, Independent, Repeatable, Self-validating, and Timely.
- id: Verification ends the chain
  parent: Tests prove behavior, not execution
  body: |
    All Production code is tested. Verification code is not Production code and is not tested.
- id: Separation of Concerns
  parent: One concern, one owner
  body: |
    Each concern has one owner in one layer, and a change to a behavior touches only its owner.
- id: The Toolchain Is the Guardrail
  parent: Make the wrong thing fail
  body: |
    The quality bar is defined once in the build toolchain, which fails on invalid changes and is never weakened.
- id: Prepare reader for evolving producer
  parent: Robustness Principle
  body: |
    Every reader tolerates unrecognized changes so that the producer evolves without updating readers first.
- id: Adoption is articulation
  parent: The practitioner decides the outcome
  body: |
    Tool and AI agent adoption requires documenting the governing standard as explicit written rules.
- id: Production Parity
  parent: Environment parity
  body: |
    Tests execute Production code in parity with production runtime conditions.
- id: Infrastructure as Code
  parent: Environment parity
  body: |
    Every environment is provisioned from version control, and no environment is assembled by hand.
- id: Own the Runtime
  parent: Telemetry over guesswork
  body: |
    Every behavior ships with an observable Signal in telemetry.
- id: Don't Repeat Yourself
  parent: Duplication drifts
  body: |
    Every piece of knowledge has a single, unambiguous, authoritative representation within a system.
  references:
  - id: The Pragmatic Programmer, Tip 15
    uri: https://pragprog.com/tips/
    quote: Every piece of knowledge must have a single, unambiguous, authoritative representation within a system.
- id: Replace conditional with polymorphism
  parent: Polymorphism over conditionals
  body: |
    Variant selection resolves at the Perimeter through a Factory, Feature, or Builder, while domain logic executes through polymorphic Domain objects without Branching logic.
- id: Contract First
  parent: Agree at the boundary
  body: |
    A contract governs both sides of a boundary. Each side derives from and conforms to the contract, and code that disagrees with the contract is invalid.
- id: Less is more
  parent: Clarity over cleverness
  body: |
    An implementation retains only what directly serves its stated intent and removes everything else.
  references:
  - id: Antoine de Saint-Exupéry
    uri: https://en.wikiquote.org/wiki/Antoine_de_Saint-Exup%C3%A9ry
    quote: Perfection is achieved, not when there is nothing more to add, but when there is nothing left to take away.
- id: Make it work, make it right, make it fast
  parent: Premature optimization and Jackson's rules
  body: |
    Implementation delivers working behavior in small slices first, refactors for clarity second, and optimizes only measured bottlenecks last without sacrificing readability.
  references:
  - id: Kent Beck
    uri: https://wiki.c2.com/?MakeItWorkMakeItRightMakeItFast
    quote: Make it work, make it right, make it fast.
  solutions:
  - body: |
      The developer reduces scope, splits the Pull request into smaller increments, and ships a working slice.
- id: Iterations over calls over the network is bad design
  parent: Amdahl's Law and the I/O-bound reality
  body: |
    Code batches remote operations and avoids iterations over Calls over the network.
