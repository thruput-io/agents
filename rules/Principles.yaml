principles:
- id: You aren't gonna need it
  parent: Code is a liability, not an asset
  body: |
    Always implement things when you actually need them, never when you just foresee that you need them ([Ron Jeffries](https://ronjeffries.com/xprog/articles/practices/pracnotneed/)).
- id: Code as a Subset of the Purpose
  parent: Code is a liability, not an asset
  body: |
    Every part of the code solves some part of its [[Purpose]], and no part reaches outside it. What it solves, it solves accurately and without harm the [[Users]] would not accept.
- id: Choose boring technology
  parent: Code is a liability, not an asset
  body: |
    Keep the [[Development Stack]] small and well known: "every company gets about three innovation tokens" ([Dan McKinley](https://mcfunley.com/choose-boring-technology)).
- id: Convention Over Novelty
  parent: Convention over invention
  body: |
    Structure follows the conventions of the ecosystem and of the [[Surrounding code]]; novelty belongs in the domain solution. Only a [[Demonstrable standard]] is a convention.
- id: Push tests down the pyramid
  parent: The Practical Test Pyramid
  body: |
    Catch a defect on the lowest level of the [[Test Pyramid]] that can catch it.
- id: No Comments
  parent: Intent lives where it is checked
  body: |
    What a comment would say lives where it is checked. Every [[Comment intent]] has such a home, and only a [[Machine-read comment]] stays in the code.
- id: Fail fast
  parent: Crash, don't guess
  body: |
    A system fails loudly and at once on an unexpected state; it never continues on a guess. A safeguard that swallows a failure is added only where [[Evidence]] shows the need.
- id: Fold at Perimeter
  parent: Translate at the door
  body: |
    The [[Foreign shape]] is folded into an [[Encapsulated type]] at the [[Perimeter]] and back only there. Inward of that point nothing sees it.
- id: Make illegal states unrepresentable
  parent: Encapsulation
  body: |
    Choose the [[Type system]] over a [[Runtime check]], and model every business rule, transition, and entity as a dedicated type rather than a data bag. A state that cannot be held needs no validator, no test, and no bug report.
- id: Parse, don't validate
  parent: Translate at the door
  body: |
    Parse raw input once, at the [[Perimeter]], through the [[Validating path of creation]], and pass the type on; never check a primitive and pass the primitive on.
- id: Immutable by default
  parent: Encapsulation
  body: |
    A [[Domain object]] is [[Immutable]]. A validly constructed object that cannot change cannot become invalid.
- id: No Primitive Obsession
  parent: Encapsulation
  body: |
    Any primitive in a method signature is the [[Primitive Obsession]] smell: the value it carries deserves a type of its own. The only exception is a method at the [[Perimeter]] that takes in or hands out a [[Foreign shape]].
- id: Optionality Drives Complexity
  parent: Name the case, not the knob
  body: |
    Each allowed combination of options is its own operation with its own name; [[Optionality]] is never a parameter.
- id: Nothing Is Complete Without Verification
  parent: Tests prove behaviour, not execution
  body: |
    A change is finished when a test shows the behaviour and fails when it breaks, not when the code is written. The tests are the documentation of what the code does.
- id: Verification ends the chain
  parent: Tests prove behaviour, not execution
  body: |
    All [[Production code]] is tested. [[Verification code]] is not production code and is not tested.
- id: Separation of Concerns
  parent: One concern, one owner
  body: |
    Each concern has one owner in one layer, and a change to a behaviour touches only its owner.
- id: The Toolchain Is the Guardrail
  parent: Make the wrong thing fail
  body: |
    The quality bar is defined once, in the build, and the build makes the wrong thing fail; it is never weakened to let a change through.
- id: Prepare reader for evolving producer
  parent: Robustness Principle
  body: |
    Every reader accepts changes it does not know, so the producer evolves without updating every reader first.
- id: Adoption is articulation
  parent: The practitioner decides the outcome
  body: |
    Adopting a tool that applies our standard begins by writing the standard down: the rule an [[AI agent]] needs is the rule a new colleague needs, and the reason it was never written is that it lived as habit. An adoption that leaves our craft no more clearly stated than before has adopted nothing.
- id: The environment is code
  parent: Environment parity
  body: |
    Every environment is provisioned from one definition in version control; none is assembled by hand.
- id: Own the Runtime
  parent: Telemetry over guesswork
  body: |
    A behaviour ships with its [[Signal]]; if we cannot see it, it is not shipped.
- id: Don't Repeat Yourself
  parent: Code is a liability, not an asset
  body: |
    Every piece of knowledge must have a single, unambiguous, authoritative representation within a system ([The Pragmatic Programmer, Tip 15](https://pragprog.com/tips/)).
- id: Contract First
  parent: Agree at the boundary
  body: |
    The contract stands above both sides of a boundary: each side is derived from it and conforms to it, and where code and contract disagree, the code is wrong.
