definitions:
- id: Marker
  specification: |
    The RFC 2119 priority word that opens a [[Rule]] or a solution.
  closedEnumerationOf:
  - MUST
  - MUST NOT
  - SHOULD
  - SHOULD NOT
  - MAY
- id: MUST
  specification: |
    An absolute requirement.
- id: MUST NOT
  specification: |
    An absolute prohibition.
- id: SHOULD
  specification: |
    A requirement that may be set aside only with a stated, valid reason.
- id: SHOULD NOT
  specification: |
    A prohibition that may be set aside only with a stated, valid reason.
- id: MAY
  specification: |
    An option.
- id: Defined
  specification: |
    Exists as an entry in this glossary.
- id: Id
  specification: |
    The name of an entry, and the only stable handle for citing it. Ids are unique across every document, compared case-insensitively with whitespace normalized. In prose an id is cited as [[Id]].
- id: Group
  specification: |
    The topical cluster that orders and categorizes [[Rule]]s for readers without affecting precedence.
- id: Parent
  specification: |
    The [[Id]] of the entry directly above in the hierarchy.
- id: Purpose
  specification: |
    The stated reason something is built or changed, expressed as the benefit it delivers to [[Users]].
- id: Users
  specification: |
    Whoever consumes the software or system to fulfill a need; a [[Developer]] is not a [[User]].
  openEnumerationOf:
  - End user
  - Operator
  - External system
  - AI agent
- id: End user
  specification: |
    A person who uses the product to meet their own need.
- id: Operator
  specification: |
    A person who keeps the system running in production.
- id: External system
  specification: |
    A system outside the current code base that calls it or is called by it.
- id: AI agent
  specification: |
    A program that pursues a goal autonomously, using a model to decide its next action.
- id: Developer
  specification: |
    A person or [[AI agent]] who writes, reviews, or maintains the code; a [[Developer]] is not a [[User]].
- id: Type
  specification: |
    A construct that defines a set of values together with the valid operations on them.
- id: Component
  specification: |
    A [[Class]] or larger unit of code—such as a file, folder, [[Module]], package, or project—with its own [[Interface]] and namespace governing visibility.
- id: Class
  specification: |
    A construct that defines a [[Type]] as a set of values together with the operations on them.
- id: File
  specification: |
    Alias for [[Component]].
- id: Function
  specification: |
    A callable unit of code that takes zero or more parameters and returns a [[Return value]].
- id: Interface
  specification: |
    The boundary through which code outside a [[Component]] invokes it.
- id: Public method
  specification: |
    An invocation receiver of an [[Interface]] callable by code outside the [[Component]].
- id: Domain object
  specification: |
    An [[Immutable]] [[Type]] in the domain [[Layer]] that models a business concept, upholds its [[Invariant]]s through its [[Validating path of creation]], and interacts only through [[Domain objects]].
- id: Encapsulated type
  specification: |
    A [[Class]] into which one or more [[Primitive]]s are folded at the [[Perimeter]], named for what the values mean rather than for their shape, with a single [[Validating path of creation]], and [[Immutable]].
  openEnumerationOf:
  - Domain primitive
- id: Domain primitive
  specification: |
    The special case where a single [[Primitive]] is wrapped.
- id: Loose type
  specification: |
    A [[Type]] whose cardinality admits [[Illegal state]]s by design, the opposite of [[Make illegal states unrepresentable]].
  openEnumerationOf:
  - Optionality
  - Primitive Obsession
  - Mutator
- id: Primitive Obsession
  specification: |
    Representing a domain value with one or more [[Primitive]]s instead of a dedicated [[Encapsulated type]].
- id: Optionality
  specification: |
    A choice left open in a value or parameter, such as whether it is present at all.
- id: Setter
  specification: |
    An operation that assigns a new value to a field of an existing [[Instance]].
- id: Immutable
  specification: |
    Unable to change after creation.
- id: Code We Cannot Control
  specification: |
    Code outside the current codebase whose [[Foreign shape]] we cannot change.
  openEnumerationOf:
  - Framework
  - Library
  - External system
  - User input
- id: Framework
  specification: |
    Code outside the current code base that calls our code and owns the flow of control.
- id: Library
  specification: |
    Code outside the current code base that our code calls, leaving the flow of control with our code.
- id: User input
  specification: |
    Data entered by a person through a user [[Interface]].
- id: Perimeter
  specification: |
    A point in our code that either invokes, or is invoked by, [[Code We Cannot Control]].
- id: Illegal state
  specification: |
    A combination of values that the domain never defined as valid.
- id: Development Stack
  specification: |
    The ways to meet a need, in order of how little code we own afterwards.
  closedEnumerationOf:
  - No code
  - Codebase reuse
  - Platform or framework
  - External dependency
  - External tool or service
  - New code
- id: No code
  specification: |
    Meeting the need without any code.
- id: Codebase reuse
  specification: |
    Meeting the need with code already in this codebase, refactored into a reusable [[Component]] where it is not one yet.
- id: Platform or framework
  specification: |
    The runtime platform or [[Framework]] in use.
- id: External dependency
  specification: |
    An existing external [[Component]] added to the project as a dependency.
- id: External tool or service
  specification: |
    An external tool or remote service integrated with or called by the system.
- id: New code
  specification: |
    Source code written in the current codebase.
- id: Test Pyramid
  specification: |
    The places a defect can be caught, from the base, earliest and cheapest, to the top, latest and costliest.
  closedEnumerationOf:
  - Type system
  - Static code analysis
  - Unit test
  - Narrow integration test
  - Integration test
  - End-to-end test
  - Manual test
- id: Type system
  specification: |
    The set of rules in a language that assigns a [[Type]] to every construct and verifies how they compose.
- id: Static code analysis
  specification: |
    Analysing source code before it runs, with a linter or another static tool.
- id: Unit test
  specification: |
    A [[Test]] that exercises one [[Subject under test]] in-process, without an [[External dependency]].
- id: Narrow integration test
  specification: |
    A [[Test]] that exercises one [[Subject under test]] against a real [[Instance]] of the [[External dependency]] it communicates with, such as a database container.
- id: Integration test
  specification: |
    A [[Test]] that exercises one [[Subject under test]]—the shipped [[Runtime artifact]]—using [[Black-box testing]] against containerized [[External dependency]] instances.
- id: End-to-end test
  specification: |
    A [[Test]] that exercises fully deployed services across a running staging [[Environment]].
- id: Manual test
  specification: |
    A [[Test]] performed by a person exercising the running system.
- id: Evidence
  specification: |
    A verifiable reference that grounds a [[Change]] or assumption; a practice recalled from experience is not [[Evidence]].
  closedEnumerationOf:
  - Code reference
  - Test reference
  - Document reference
- id: Code reference
  specification: |
    A full URL to code on the main branch of an existing or public repository.
- id: Test reference
  specification: |
    An executable [[Test]] in an existing repository.
- id: Document reference
  specification: |
    A full URL to a specific section of an article or document.
- id: Demonstrable standard
  specification: |
    A standard that can be pointed at. A habit recalled from past experience, or a practice whose community has moved on, is not a demonstrable standard.
  closedEnumerationOf:
  - Published convention
  - Maintained library or framework
  - Community pattern
- id: Published convention
  specification: |
    A convention that is written down and published.
- id: Maintained library or framework
  specification: |
    A [[Library]] or [[Framework]] that is actively maintained.
- id: Community pattern
  specification: |
    A pattern in current use by a large, active community.
- id: Machine-read comment
  specification: |
    A comment that something other than a human reader requires.
  closedEnumerationOf:
  - Shebang
  - Machine-read directive
  - Published API documentation
  - Mandated license header
  - Generated-file banner
- id: Shebang
  specification: |
    The first line of a script, naming the interpreter that runs it.
- id: Machine-read directive
  specification: |
    A directive to a [[Compiler]] or linter that is syntactically a comment.
- id: Published API documentation
  specification: |
    Documentation of an [[Interface]] that a tool extracts to a published documentation site.
- id: Mandated license header
  specification: |
    A legal license notice required at the top of a [[File]].
- id: Generated-file banner
  specification: |
    A notice marking a [[File]] as [[Generated code]].
- id: Great Code
  specification: |
    Code that avoids becoming a [[System Failed State]].
- id: Great software
  specification: |
    Alias for [[Great Code]].
- id: Bad Code
  specification: |
    Code that drives a software system through [[System Decay]] toward a [[System Failed State]].
- id: Inaccurate
  specification: |
    The state where the system diverges from what [[Users]] need, failing to fulfill their intended outcome.
- id: System Decay
  specification: |
    The progressive transition of a software system from a healthy state into one or more [[System Failed State]]s, caused by the accumulation of [[Bad Code]].
- id: System Failed State
  specification: |
    A non-operational state the software transitions into when [[Bad Code]] accumulates.
  openEnumerationOf:
  - Velocity Stagnation
  - Regression Cascades
  - Knowledge Dissipation
  - Deployment Paralysis
  - Value Failure
- id: Velocity Stagnation
  specification: |
    The codebase has become so complex or fragile that the team can no longer deliver value at a sustainable pace.
- id: Regression Cascades
  specification: |
    Fixing one bug consistently introduces new, unrelated bugs elsewhere in the application.
- id: Knowledge Dissipation
  specification: |
    A condition where the system runs, but no active [[Developer]] understands how or why its core logic works.
- id: Deployment Paralysis
  specification: |
    A condition where [[Change]]s are complete, but the system cannot be safely shipped to production.
- id: Value Failure
  specification: |
    The system has become [[Inaccurate]], failing to do what [[Users]] need.
- id: Architectural Direction
  specification: |
    The cumulative fold of immutable ADR records under `docs/adrs/`, read from highest-numbered downward so later decisions supersede earlier ones, governing where the project is heading rather than describing its current state.
- id: Software quality axis
  specification: |
    One of ten dimensions defining software quality.
  closedEnumerationOf:
  - Correctness
  - Maintainability
  - Readability
  - Testability
  - Structural simplicity
  - True Test Coverage
  - Ease of Doing the Right Thing
  - Guardrails Against Doing the Wrong Thing
  - Automation
  - Currency of Tools and Libraries
- id: Correctness
  specification: |
    The degree to which software accurately delivers what [[Users]] need.
- id: Maintainability
  specification: |
    The property that changing a behavior requires understanding and touching only the [[Component]] that owns it.
- id: Readability
  specification: |
    The property that a [[Developer]] unfamiliar with the code understands what it does and why without asking the author.
- id: Testability
  specification: |
    The property that behavior is exercised in isolation without standing up networks, clocks, or global state.
- id: Structural simplicity
  specification: |
    [[Simplicity]] as it shows in the design: the property that the design carries no structure that a present requirement does not demand.
- id: True Test Coverage
  specification: |
    The property that [[Test]]s fail when behavior breaks rather than merely executing code paths.
- id: Ease of Doing the Right Thing
  specification: |
    The property that the compliant approach is the [[Path of least resistance]] for the next [[Developer]].
- id: Guardrails Against Doing the Wrong Thing
  specification: |
    The property that [[Type]]s, [[Test]]s, and [[Static code analysis]] cause invalid approaches to fail early rather than relying on human vigilance.
- id: Automation
  specification: |
    The property that the path from a [[Change]] to verified deployment executes without manual intervention.
- id: Currency of Tools and Libraries
  specification: |
    The property that [[External dependency]] versions stay current and easily updated.
- id: Comment intent
  specification: |
    A reason prose is written as a comment in source code.
  closedEnumerationOf:
  - Clarification
  - Procrastination
  - Architectural decision
  - Usage guidance
  - Apology or confession
- id: Clarification
  specification: |
    Explaining the intent or behavior of code.
- id: Procrastination
  specification: |
    Deferring unfinished work in code, such as with a TODO marker.
- id: Architectural decision
  specification: |
    A design choice that shapes the structure or direction of the system.
- id: Usage guidance
  specification: |
    Instructions explaining how to invoke, configure, or operate a [[Component]] or system.
- id: Apology or confession
  specification: |
    Acknowledging or excusing a known defect, limitation, or design flaw in code.
- id: User
  specification: |
    Alias for [[Users]].
- id: Quality
  specification: |
    Alias for [[Software quality axis]].
- id: Domain objects
  specification: |
    Alias for [[Domain object]].
- id: Validating path of creation
  specification: |
    The single path through which an [[Encapsulated type]] or [[Domain object]] is constructed at the [[Perimeter]], establishing every [[Invariant]] before returning an [[Instance]].
- id: Path of least resistance
  specification: |
    Alias for [[Ease of Doing the Right Thing]].
- id: Illegal states
  specification: |
    Alias for [[Illegal state]].
- id: Failing test
  specification: |
    A [[Test]] that exercises a capability or defect and fails until the correct behavior is implemented.
- id: Production code
  specification: |
    Code that executes in a deployment runtime after the build and serves [[Users]].
- id: Verification code
  specification: |
    Code that verifies [[Production code]].
- id: Explicitly named method
  specification: |
    A method whose name states the specific domain action or concept it performs rather than using generic control knobs or boolean flags.
- id: Mutator
  specification: |
    Alias for [[Setter]].
- id: Developers
  specification: |
    Alias for [[Developer]].
- id: Practitioner
  specification: |
    A human [[Developer]] applying a tool, method, or [[Coding standard]], whose competence or incompetence the tool multiplies.
- id: Signal
  specification: |
    A log line, metric, or alert that shows a behavior working in production.
- id: Runtime check
  specification: |
    A check on a value or condition executed while the program runs.
- id: Foreign shape
  specification: |
    The form in which [[Code We Cannot Control]] represents a value.
- id: Surrounding code
  specification: |
    The existing code a [[Change]] sits among, whose conventions govern choices undecided by a [[Demonstrable standard]].
- id: Competing good
  specification: |
    A desirable property that is often traded against a [[Software quality axis]].
  closedEnumerationOf:
  - Feature Rich
  - Performance
  - Well documented
  - User Friendly
  - Industry Standard
  - Measured Coverage
- id: Feature Rich
  specification: |
    Providing an extensive set of capabilities or options within a single system or [[External dependency]].
- id: Performance
  specification: |
    The responsiveness, throughput, and resource efficiency of a system under a given workload.
- id: Well documented
  specification: |
    Accompanied by human-readable prose that explains how the system is built, configured, or operated.
- id: User Friendly
  specification: |
    Designed for effortless human interaction, typically through a graphical user [[Interface]].
- id: Industry Standard
  specification: |
    A technical standard or set of guidelines established by consensus and adopted across the software development
    industry, unless another industry is explicitly stated.
- id: Measured Coverage
  specification: |
    The quantified percentage of [[Code coverage]] reported by a tool during [[Test]] execution.
- id: Change
  specification: |
    A set of edits to the code base proposed or merged as one unit, such as a commit or a [[Pull request]].
- id: Pull request
  specification: |
    A proposed [[Change]] submitted for review before merging into the main branch.
- id: Compatibility branch
  specification: |
    A conditional path that runs only on a particular platform, shell, or [[Environment]].
- id: Representation
  specification: |
    One place where a piece of knowledge is written down: in code, configuration, schema, or documentation.
- id: Instance
  specification: |
    One concrete value constructed from a [[Type]].
- id: Factory
  specification: |
    A named [[Function]] or method that creates and returns [[Instance]]s of a [[Type]].
- id: Invariant
  specification: |
    A condition that holds true for every [[Instance]] of a [[Type]] from creation onward.
- id: Constructor
  specification: |
    The language operation that allocates and initializes a new [[Instance]] of a [[Type]].
- id: Module
  specification: |
    A [[Component]] that forms a namespace and, where the language supports it, a compile-time dependency boundary—such as a project or assembly in C#, a package in Go, a crate in Rust, or a module in Java or TypeScript—that decides which of its parts are visible outside it and which other modules it may reference.
- id: Signature
  specification: |
    The declared [[Parameter type]]s and [[Return type]] of a [[Function]] or method.
- id: Exception
  specification: |
    A signal that interrupts normal control flow to report a failure, unwinding the stack until something catches it.
- id: Sum type
  specification: |
    A [[Type]] whose value is exactly one of a closed set of alternatives, each optionally carrying its own data.
- id: Product type
  specification: |
    A [[Type]] whose value holds all of its declared fields simultaneously, such as a record, struct, or tuple.
- id: Enum
  specification: |
    A [[Type]] with a fixed, named set of values.
- id: Pure enum
  specification: |
    An [[Enum]] that carries only labels or scalar values without [[Domain method]]s of its own.
- id: Inheritance
  specification: |
    Defining specialized subtypes that fulfill a shared base [[Type]] or [[Interface]] so each subtype supplies its own behavior.
- id: Strategy
  specification: |
    An object that encapsulates one interchangeable behavior behind a shared [[Interface]] so callers invoke the [[Interface]] without [[Branching]].
- id: Compiler
  specification: |
    A program that translates source code into another form and rejects code that violates language and [[Type system]] rules.
- id: Pattern matching
  specification: |
    Selecting code to run by the shape of a value, with one branch per case.
- id: Wildcard pattern
  specification: |
    A catch-all pattern in [[Pattern matching]] that matches any unlisted value.
- id: Aggregate
  specification: |
    A cluster of [[Domain objects]] treated as a single unit for state changes and entered only through its root, which upholds all [[Invariant]]s.
- id: Domain method
  specification: |
    An operation defined on a [[Domain object]] that expresses a business action in domain terms.
- id: Raw collection
  specification: |
    A plain list, set, or map not wrapped in an [[Encapsulated type]].
- id: Primitive
  specification: |
    A built-in scalar, literal, or general-purpose value [[Type]] (such as integers, strings, booleans, `Money`, or `Date`) that carries no domain-specific [[Invariant]]s.
- id: Layer
  specification: |
    A horizontal architectural slice that groups code with a shared responsibility and depends only in the declared [[Dependency direction]].
- id: Dependency direction
  specification: |
    The direction in which one [[Layer]] or [[Module]] is permitted to depend on another.
- id: Helper code
  specification: |
    Supporting utility code that serves other code rather than a direct [[User]]-facing behavior.
- id: Try/catch block
  specification: |
    A language construct that executes a block and hands control to a handler when an [[Exception]] is raised.
- id: Rethrow
  specification: |
    Raising a caught [[Exception]] again from its handler so it continues propagating upward instead of being swallowed.
- id: Default value
  specification: |
    A value used when no other is given, or when obtaining the real one failed.
- id: Fallback strategy
  specification: |
    A second way of doing the same work, tried when the first one fails.
- id: Return value
  specification: |
    The outcome returned by a [[Function]], command, or process, including an error return or faulted task.
  openEnumerationOf:
  - Exit status
- id: Exit status
  specification: |
    The outcome code of a process or command indicating whether it succeeded or failed.
- id: Error output
  specification: |
    The separate output stream a program writes its error messages and diagnostics to.
- id: Abort-on-error mode
  specification: |
    A setting in which a script stops at the first command that fails, such as `set -e` in Bash.
- id: Branching logic
  specification: |
    Code that chooses between paths at run time, such as if, switch, or a default in a lookup.
- id: Branching
  specification: |
    Alias for [[Branching logic]].
- id: Test
  specification: |
    Executable [[Verification code]] that runs a [[Subject under test]] and checks that it behaves as specified.
- id: Test case
  specification: |
    One discrete scenario within a [[Test]] suite comprising [[Test setup]], an action, and the expected [[Assertion]].
- id: Muted test
  specification: |
    A [[Test]] that is switched off, omitted from CI/CD [[Pull request]] checks, or prevented from failing the build.
- id: Code coverage
  specification: |
    The proportion of [[Production code]] executed while the [[Test]]s run.
- id: Assertion
  specification: |
    A statement in a [[Test]] that compares an actual [[Return value]] against the expected value and fails the [[Test]] when they differ.
- id: Flaky test
  specification: |
    A [[Test]] that passes and fails on the same code without any [[Change]].
- id: Subject under test
  specification: |
    The one [[Component]] a [[Test]] exercises and whose behavior it checks.
- id: Runtime artifact
  specification: |
    The built output deployed and executed in an [[Environment]], such as a container image, package, or binary.
- id: Black-box testing
  specification: |
    Testing exclusively through a [[Component]]'s public [[Interface]] without coupling to internal implementation.
- id: Test setup
  specification: |
    The code that brings the system into the state a [[Test]] needs before the action runs.
- id: Lint rule
  specification: |
    One check performed by [[Static code analysis]], reporting each location that violates it.
- id: Pragma
  specification: |
    A directive to a [[Compiler]] or tool, written in the code, that changes how it treats that code.
- id: Generated code
  specification: |
    Code produced by a tool from another [[Representation]] rather than authored directly by a [[Developer]].
- id: Preset
  specification: |
    A named set of [[Lint rule]]s and settings shared by many projects, used as a starting configuration.
- id: Optional parameter
  specification: |
    A parameter a caller may leave out, in which case a [[Default value]] is used.
- id: Overload
  specification: |
    One of several methods with the same name that differ in their [[Parameter type]]s.
- id: API
  specification: |
    Alias for [[Interface]].
- id: Statement
  specification: |
    The smallest unit of code that performs an action, such as an assignment, a call, or a return.
- id: Return type
  specification: |
    The declared [[Type]] of what a [[Function]] returns.
- id: Parameter type
  specification: |
    The declared [[Type]] accepted by a [[Function]] parameter.
- id: Feature
  specification: |
    A cohesive [[User]]-facing capability or vertical slice of behavior isolated in its own [[Component]].
- id: Feature toggle
  specification: |
    A conditional switch that enables or disables a [[Feature]] at runtime without deploying a new [[Change]].
- id: Builder
  specification: |
    A construct that assembles an [[Instance]] step by step before producing the final object.
- id: In-memory operation
  specification: |
    Computation that executes entirely within process memory without [[Calls over the network]].
- id: Contract
  specification: |
    A specification, separate from the code, of what crosses a boundary and what each side must provide.
- id: Coding standard
  specification: |
    A written set of [[Rule]]s governing how code is authored so the codebase reads with uniform structure.
- id: Environment
  specification: |
    A place where the system runs with its own configuration and infrastructure, such as local, test, or production.
- id: Calls over the network
  specification: |
    Invocations that traverse a network boundary to communicate with another service, database, or process.
  openEnumerationOf:
  - Access to filesystem
  - Access to database
  - Access to HTTP
- id: Access to filesystem
  specification: |
    Accessing a local or remote file system.
- id: Access to database
  specification: |
    Accessing a relational, document, or key-value database.
- id: Access to HTTP
  specification: |
    Accessing an HTTP or HTTPS endpoint.
- id: Head commit
  specification: |
    The commit a review of a [[Change]] is anchored to. Every file read and every inline comment resolves against it.
- id: Checkout
  specification: |
    The [[Head commit]] checked out with a clean working tree.
- id: Surface
  specification: |
    The code a [[Violation]] may be reported against, identified by file and line numbers on the left (base) and right (head): changes carrying an unresolved comment, changes carrying a comment the author has resolved since the prior review, and changes new since the prior review (on a first review, the whole [[Change]]).
- id: Full context
  specification: |
    The [[Checkout]] and [[Surface]] together with every changed [[File]] in full, call sites of changed public symbols, and covering [[Verification code]] used to reach a [[Verdict]].
- id: Ruleset
  specification: |
    A subset or grouping of [[Rule]]s evaluated together as a unit.
- id: Violation
  specification: |
    A finding that code on the [[Surface]] breaks a [[Rule]].
- id: Verdict
  specification: |
    The outcome of evaluating [[Full context]] against a [[Rule]] or [[Ruleset]] and recording it in the [[Ledger]]: [[Violation]] or non-violation.
- id: Ledger
  specification: |
    The audit record across all [[Ruleset]]s containing one row per [[Rule]] with [[Evidence]] of what was examined and the resulting [[Verdict]].
